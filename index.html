<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Mi Inteligencia de Ahorro</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F3F7F2] text-slate-800 flex justify-center items-center min-h-screen m-0">
    <div id="root" class="w-full max-w-md h-screen md:h-[850px] bg-[#F3F7F2] shadow-2xl flex flex-col relative overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CUENTAS_BASE = [
          { id: '1', nombre: 'Efectivo en Mano', tipo: 'Efectivo', saldoInicial: 0, icono: '💵' },
          { id: '2', nombre: 'Bancolombia', tipo: 'Banco', saldoInicial: 0, icono: '🏦' },
          { id: '3', nombre: 'Nequi', tipo: 'Billetera', saldoInicial: 0, icono: '📱' },
        ];

        const CATEGORIAS_GASTO_BASE = [
          'Alimentación', 'Transporte', 'Servicios / Hogar', 'Ocio / Salidas', 'Salud', 'Educación', 'Otros Gastos'
        ];

        const CATEGORIAS_INGRESO_BASE = [
          'Salario / Nómina', 'Ventas / Negocio', 'Otros Ingresos'
        ];

        const guardarEnStorage = (clave, valor) => {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              window.localStorage.setItem(clave, JSON.stringify(valor));
            }
          } catch (e) {}
        };

        const cargarDeStorage = (clave, valorPorDefecto) => {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              const data = window.localStorage.getItem(clave);
              if (data) return JSON.parse(data);
            }
          } catch (e) {}
          return valorPorDefecto;
        };

        const formatoCOP = (valor) => {
          if (isNaN(valor) || valor === null || valor === undefined) return '$ 0';
          const signo = valor < 0 ? '-' : '';
          const valorAbs = Math.abs(Math.round(valor));
          const partes = valorAbs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          return `${signo}$ ${partes}`;
        };

        const formatearInputEnVivo = (inputStr) => {
          if (!inputStr) return '';
          const limpio = inputStr.toString().replace(/\D/g, '');
          if (!limpio) return '';
          return Number(limpio).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        };

        const obtenerNumeroLimpio = (inputStr) => {
          if (!inputStr) return 0;
          return parseInt(inputStr.toString().replace(/\D/g, ''), 10) || 0;
        };

        const fechaHoy = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const dia = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${dia}`;
        };

        const primerDiaMes = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          return `${y}-${m}-01`;
        };

        const notificar = (titulo, mensaje) => {
          if (typeof window !== 'undefined') {
            window.alert(`${titulo}\n\n${mensaje}`);
          }
        };

        function App() {
          const [tab, setTab] = useState('inicio');

          const [cuentas, setCuentas] = useState(() =>
            cargarDeStorage('mia_cuentas_v2', CUENTAS_BASE)
          );

          const [movimientos, setMovimientos] = useState(() =>
            cargarDeStorage('mia_movimientos_v2', [])
          );

          const [cuentasPorCobrar, setCuentasPorCobrar] = useState(() =>
            cargarDeStorage('mia_cxco_v8', [])
          );

          const [cuentasPorPagar, setCuentasPorPagar] = useState(() =>
            cargarDeStorage('mia_cxpa_v8', [])
          );

          // Listas personalizadas de categorías y conceptos de deudas
          const [categoriasGasto, setCategoriasGasto] = useState(() =>
            cargarDeStorage('mia_cat_gasto', CATEGORIAS_GASTO_BASE)
          );
          const [categoriasIngreso, setCategoriasIngreso] = useState(() =>
            cargarDeStorage('mia_cat_ingreso', CATEGORIAS_INGRESO_BASE)
          );
          const [conceptosDeuda, setConceptosDeuda] = useState(() =>
            cargarDeStorage('mia_conceptos_deuda', [...CATEGORIAS_GASTO_BASE, ...CATEGORIAS_INGRESO_BASE, 'Préstamo Personal', 'Inversión'])
          );

          useEffect(() => { guardarEnStorage('mia_cuentas_v2', cuentas); }, [cuentas]);
          useEffect(() => { guardarEnStorage('mia_movimientos_v2', movimientos); }, [movimientos]);
          useEffect(() => { guardarEnStorage('mia_cxco_v8', cuentasPorCobrar); }, [cuentasPorCobrar]);
          useEffect(() => { guardarEnStorage('mia_cxpa_v8', cuentasPorPagar); }, [cuentasPorPagar]);
          useEffect(() => { guardarEnStorage('mia_cat_gasto', categoriasGasto); }, [categoriasGasto]);
          useEffect(() => { guardarEnStorage('mia_cat_ingreso', categoriasIngreso); }, [categoriasIngreso]);
          useEffect(() => { guardarEnStorage('mia_conceptos_deuda', conceptosDeuda); }, [conceptosDeuda]);

          // Formulario Movimiento General
          const [tipoMovimiento, setTipoMovimiento] = useState('Gasto');
          const [cuentaSeleccionada, setCuentaSeleccionada] = useState(cuentas[0]?.id || '1');
          const [categoriaSeleccionada, setCategoriaSeleccionada] = useState(categoriasGasto[0]);
          const [concepto, setConcepto] = useState('');
          const [valorDisplay, setValorDisplay] = useState('');
          const [fechaMovimiento, setFechaMovimiento] = useState(fechaHoy());

          // Selector unificado en módulo CxC / CxP
          const [tipoCxUnified, setTipoCxUnified] = useState('CxC');
          const [fechaGeneralReg, setFechaGeneralReg] = useState(fechaHoy());

          // Formularios CxC y CxP
          const [terceroCxC, setTerceroCxC] = useState('');
          const [conceptoCxC, setConceptoCxC] = useState(conceptosDeuda[0]);
          const [nuevoConceptoCxC, setNuevoConceptoCxC] = useState('');
          const [usarNuevoConceptoCxC, setUsarNuevoConceptoCxC] = useState(false);

          const [saldoInicialCxCDisplay, setSaldoInicialCxCDisplay] = useState('');
          const [vencimientoCxC, setVencimientoCxC] = useState(fechaHoy());
          const [cuentaCxC, setCuentaCxC] = useState(cuentas[0]?.id || '1');
          const [obsCxC, setObsCxC] = useState('');

          const [terceroCxP, setTerceroCxP] = useState('');
          const [conceptoCxP, setConceptoCxP] = useState(conceptosDeuda[0]);
          const [nuevoConceptoCxP, setNuevoConceptoCxP] = useState('');
          const [usarNuevoConceptoCxP, setUsarNuevoConceptoCxP] = useState(false);

          const [saldoInicialCxPDisplay, setSaldoInicialCxPDisplay] = useState('');
          const [vencimientoCxP, setVencimientoCxP] = useState(fechaHoy());
          const [cuentaCxP, setCuentaCxP] = useState(cuentas[0]?.id || '1');
          const [obsCxP, setObsCxP] = useState('');

          // Estados para pagos unificados
          const [tipoAbonoUnified, setTipoAbonoUnified] = useState('CxC');
          const [fechaAbonoUnified, setFechaAbonoUnified] = useState(fechaHoy());
          const [pagoIdCxC, setPagoIdCxC] = useState('');
          const [montoPagoCxCDisplay, setMontoPagoCxCDisplay] = useState('');
          const [cuentaPagoCxC, setCuentaPagoCxC] = useState(cuentas[0]?.id || '1');

          const [pagoIdCxP, setPagoIdCxP] = useState('');
          const [montoPagoCxPDisplay, setMontoPagoCxPDisplay] = useState('');
          const [cuentaPagoCxP, setCuentaPagoCxP] = useState(cuentas[0]?.id || '1');

          // Filtro de reporte por Tercero
          const [tipoReporteTercero, setTipoReporteTercero] = useState('CxC');
          const [terceroSeleccionadoId, setTerceroSeleccionadoId] = useState('');

          const [modalNuevaCuenta, setModalNuevaCuenta] = useState(false);
          const [nuevoNombre, setNuevoNombre] = useState('');
          const [nuevoTipo, setNuevoTipo] = useState('Banco');
          const [nuevoSaldoInitDisplay, setNuevoSaldoInitDisplay] = useState('');

          const [modalEditarSaldo, setModalEditarSaldo] = useState(false);
          const [cuentaAEditar, setCuentaAEditar] = useState(null);
          const [saldoEditadoValorDisplay, setSaldoEditadoValorDisplay] = useState('');

          const [fechaDesde, setFechaDesde] = useState(primerDiaMes());
          const [fechaHasta, setFechaHasta] = useState(fechaHoy());

          const obtenerSaldoCuenta = (cuentaId) => {
            const c = cuentas.find((item) => item.id === cuentaId);
            if (!c) return 0;
            const ing = movimientos
              .filter((m) => m.cuentaId === cuentaId && m.tipo === 'Ingreso')
              .reduce((acc, m) => acc + m.valor, 0);
            const gas = movimientos
              .filter((m) => m.cuentaId === cuentaId && m.tipo === 'Gasto')
              .reduce((acc, m) => acc + m.valor, 0);
            return c.saldoInicial + ing - gas;
          };

          const patrimonioTotal = cuentas.reduce((acc, c) => acc + obtenerSaldoCuenta(c.id), 0);
          const totalCxCPendiente = cuentasPorCobrar.reduce((acc, item) => acc + item.saldoPendiente, 0);
          const totalCxPPendiente = cuentasPorPagar.reduce((acc, item) => acc + item.saldoPendiente, 0);

          const guardarMovimiento = () => {
            const num = obtenerNumeroLimpio(valorDisplay);
            if (!concepto.trim() || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Escribe un concepto y un valor numérico válido en COP.');
              return;
            }

            const nuevo = {
              id: Date.now(),
              cuentaId: cuentaSeleccionada,
              categoria: categoriaSeleccionada,
              concepto: concepto.trim(),
              valor: num,
              tipo: tipoMovimiento,
              fecha: fechaMovimiento.trim() || fechaHoy(),
            };

            setMovimientos((prev) => [nuevo, ...prev]);
            setConcepto('');
            setValorDisplay('');
            notificar('¡Registrado!', `${tipoMovimiento} guardado con éxito.`);
          };

          const guardarCxC = () => {
            const num = obtenerNumeroLimpio(saldoInicialCxCDisplay);
            const conceptoFinal = usarNuevoConceptoCxC ? nuevoConceptoCxC.trim() : conceptoCxC;

            if (!terceroCxC.trim() || !conceptoFinal || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Ingresa el tercero, concepto y un saldo inicial válido.');
              return;
            }

            if (usarNuevoConceptoCxC && !conceptosDeuda.includes(conceptoFinal)) {
              setConceptosDeuda(prev => [...prev, conceptoFinal]);
            }

            const nuevaCxC = {
              id: Date.now(),
              tercero: terceroCxC.trim(),
              concepto: conceptoFinal,
              valorTotal: num,
              saldoPendiente: num,
              fechaInicial: fechaGeneralReg,
              vencimiento: vencimientoCxC,
              cuentaId: cuentaCxC,
              observacion: obsCxC.trim(),
              estado: 'Pendiente',
              historialPagos: []
            };
            setCuentasPorCobrar(prev => [nuevaCxC, ...prev]);
            setTerceroCxC('');
            setSaldoInicialCxCDisplay('');
            setObsCxC('');
            setUsarNuevoConceptoCxC(false);
            setNuevoConceptoCxC('');
            notificar('Cuenta por Cobrar', 'Tercero y plazos registrados correctamente.');
          };

          const procesarCobroUnificado = () => {
            const item = cuentasPorCobrar.find(c => c.id.toString() === pagoIdCxC);
            const abono = obtenerNumeroLimpio(montoPagoCxCDisplay);

            if (!item || isNaN(abono) || abono <= 0) {
              notificar('Datos inválidos', 'Selecciona una cuenta por cobrar e ingresa un monto válido.');
              return;
            }
            if (abono > item.saldoPendiente) {
              notificar('Monto excedentario', 'El abono no puede ser mayor al saldo pendiente.');
              return;
            }

            const cuentaAsoc = cuentas.find(c => c.id === cuentaPagoCxC);
            const movimientoIngreso = {
              id: Date.now(),
              cuentaId: cuentaPagoCxC,
              categoria: 'Otros Ingresos',
              concepto: `Abono de ${item.tercero} (${item.concepto})`,
              valor: abono,
              tipo: 'Ingreso',
              fecha: fechaAbonoUnified,
            };
            setMovimientos(prev => [movimientoIngreso, ...prev]);

            const nuevoSaldo = item.saldoPendiente - abono;
            const nuevoEstado = nuevoSaldo === 0 ? 'Pagado' : 'Parcial';
            const registroPago = { fecha: fechaAbonoUnified, monto: abono, cuentaName: cuentaAsoc?.nombre || 'Cuenta' };

            setCuentasPorCobrar(prev => prev.map(c => c.id === item.id ? { 
              ...c, 
              saldoPendiente: nuevoSaldo, 
              estado: nuevoEstado,
              historialPagos: [...(c.historialPagos || []), registroPago]
            } : c));

            setPagoIdCxC('');
            setMontoPagoCxCDisplay('');
            notificar('¡Pago Recibido!', `Se registraron ${formatoCOP(abono)} con éxito.`);
          };

          const guardarCxP = () => {
            const num = obtenerNumeroLimpio(saldoInicialCxPDisplay);
            const conceptoFinal = usarNuevoConceptoCxP ? nuevoConceptoCxP.trim() : conceptoCxP;

            if (!terceroCxP.trim() || !conceptoFinal || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Ingresa el tercero, concepto y un saldo inicial válido.');
              return;
            }

            if (usarNuevoConceptoCxP && !conceptosDeuda.includes(conceptoFinal)) {
              setConceptosDeuda(prev => [...prev, conceptoFinal]);
            }

            const nuevaCxP = {
              id: Date.now(),
              tercero: terceroCxP.trim(),
              concepto: conceptoFinal,
              valorTotal: num,
              saldoPendiente: num,
              fechaInicial: fechaGeneralReg,
              vencimiento: vencimientoCxP,
              cuentaId: cuentaCxP,
              observacion: obsCxP.trim(),
              estado: 'Pendiente',
              historialPagos: []
            };
            setCuentasPorPagar(prev => [nuevaCxP, ...prev]);
            setTerceroCxP('');
            setSaldoInicialCxPDisplay('');
            setObsCxP('');
            setUsarNuevoConceptoCxP(false);
            setNuevoConceptoCxP('');
            notificar('Cuenta por Pagar', 'Tercero y plazos registrados correctamente.');
          };

          const procesarPagoUnificado = () => {
            const item = cuentasPorPagar.find(c => c.id.toString() === pagoIdCxP);
            const abono = obtenerNumeroLimpio(montoPagoCxPDisplay);

            if (!item || isNaN(abono) || abono <= 0) {
              notificar('Datos inválidos', 'Selecciona una cuenta por pagar e ingresa un monto válido.');
              return;
            }
            if (abono > item.saldoPendiente) {
              notificar('Monto excedentario', 'El pago no puede ser mayor al saldo pendiente.');
              return;
            }

            const cuentaAsoc = cuentas.find(c => c.id === cuentaPagoCxP);
            const movimientoGasto = {
              id: Date.now(),
              cuentaId: cuentaPagoCxP,
              categoria: 'Otros Gastos',
              concepto: `Abono a ${item.tercero} (${item.concepto})`,
              valor: abono,
              tipo: 'Gasto',
              fecha: fechaAbonoUnified,
            };
            setMovimientos(prev => [movimientoGasto, ...prev]);

            const nuevoSaldo = item.saldoPendiente - abono;
            const nuevoEstado = nuevoSaldo === 0 ? 'Pagado' : 'Parcial';
            const registroPago = { fecha: fechaAbonoUnified, monto: abono, cuentaName: cuentaAsoc?.nombre || 'Cuenta' };

            setCuentasPorPagar(prev => prev.map(c => c.id === item.id ? { 
              ...c, 
              saldoPendiente: nuevoSaldo, 
              estado: nuevoEstado,
              historialPagos: [...(c.historialPagos || []), registroPago]
            } : c));

            setPagoIdCxP('');
            setMontoPagoCxPDisplay('');
            notificar('¡Pago Realizado!', `Se descontaron ${formatoCOP(abono)} con éxito.`);
          };

          const exportarCSV = (terceroItem) => {
            if (!terceroItem) return;
            let csvContent = "data:text/csv;charset=utf-8,Fecha,Tercero,Concepto,Valor Total,Saldo Pendiente,Estado\n";
            csvContent += `${fechaHoy()},${terceroItem.tercero},${terceroItem.concepto},${terceroItem.valorTotal},${terceroItem.saldoPendiente},${terceroItem.estado}\n`;
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `reporte_${terceroItem.tercero}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const exportarPDF = (terceroItem) => {
            if (!terceroItem) return;
            const ventana = window.open('', '_blank');
            ventana.document.write(`
              <html>
                <head><title>Reporte Tercero - MIA</title></head>
                <body style="font-family: Arial, sans-serif; padding: 20px; color: #1B4332;">
                  <h2>MIA - Reporte Detallado por Tercero</h2>
                  <hr/>
                  <p><strong>Tercero:</strong> ${terceroItem.tercero}</p>
                  <p><strong>Concepto:</strong> ${terceroItem.concepto}</p>
                  <p><strong>Fecha Inicial:</strong> ${terceroItem.fechaInicial || 'N/A'}</p>
                  <p><strong>Fecha Vencimiento:</strong> ${terceroItem.vencimiento}</p>
                  <p><strong>Valor Total Inicial:</strong> ${formatoCOP(terceroItem.valorTotal)}</p>
                  <p><strong>Saldo Pendiente Actual:</strong> ${formatoCOP(terceroItem.saldoPendiente)}</p>
                  <p><strong>Estado:</strong> ${terceroItem.estado}</p>
                  <p><strong>Observaciones:</strong> ${terceroItem.observacion || 'Ninguna'}</p>
                  <hr/>
                  <h3>Historial de Movimientos:</h3>
                  <ul>
                    <li>${terceroItem.fechaInicial || ''} - Saldo Inicial: +${formatoCOP(terceroItem.valorTotal)}</li>
                    ${(terceroItem.historialPagos || []).map(p => `<li>${p.fecha} - Abono (${p.cuentaName}): -${formatoCOP(p.monto)}</li>`).join('')}
                  </ul>
                  <br/><hr/>
                  <p style="font-size: 11px; color: #666;">Generado por MIA - Mi Inteligencia de Ahorro</p>
                </body>
              </html>
            `);
            ventana.document.close();
            ventana.print();
          };

          const guardarNuevaCuenta = () => {
            const saldo = obtenerNumeroLimpio(nuevoSaldoInitDisplay);
            if (!nuevoNombre.trim()) {
              notificar('Falta el nombre', 'Ingresa el nombre del banco o cuenta.');
              return;
            }

            const iconos = { Efectivo: '💵', Banco: '🏦', Billetera: '📱' };
            const nueva = {
              id: Date.now().toString(),
              nombre: nuevoNombre.trim(),
              tipo: nuevoTipo,
              saldoInicial: saldo,
              icono: iconos[nuevoTipo],
            };

            setCuentas((prev) => [...prev, nueva]);
            setNuevoNombre('');
            setNuevoSaldoInitDisplay('');
            setModalNuevaCuenta(false);
          };

          const actualizarSaldoInicial = () => {
            if (!cuentaAEditar) return;
            const nuevoMonto = obtenerNumeroLimpio(saldoEditadoValorDisplay);

            setCuentas((prev) =>
              prev.map((c) => (c.id === cuentaAEditar.id ? { ...c, saldoInicial: nuevoMonto } : c))
            );
            setModalEditarSaldo(false);
            setCuentaAEditar(null);
            notificar('Saldo Actualizado', 'El saldo inicial ha sido modificado.');
          };

          const reiniciarTodo = () => {
            const confirmar = window.confirm('¿Deseas borrar todos tus movimientos y empezar en limpio?');
            if (confirmar) {
              setCuentas(CUENTAS_BASE);
              setMovimientos([]);
              setCuentasPorCobrar([]);
              setCuentasPorPagar([]);
              guardarEnStorage('mia_cuentas_v2', CUENTAS_BASE);
              guardarEnStorage('mia_movimientos_v2', []);
              guardarEnStorage('mia_cxco_v8', []);
              guardarEnStorage('mia_cxpa_v8', []);
              notificar('Reinicio completo', 'Tus datos se han reiniciado.');
            }
          };

          const movimientosReporte = movimientos.filter((m) => {
            if (!fechaDesde && !fechaHasta) return true;
            if (fechaDesde && m.fecha < fechaDesde) return false;
            if (fechaHasta && m.fecha > fechaHasta) return false;
            return true;
          });

          const totalGastosReporte = movimientosReporte
            .filter((m) => m.tipo === 'Gasto')
            .reduce((acc, m) => acc + m.valor, 0);

          const totalIngresosReporte = movimientosReporte
            .filter((m) => m.tipo === 'Ingreso')
            .reduce((acc, m) => acc + m.valor, 0);

          const rubrosAgrupados = movimientosReporte
            .filter((m) => m.tipo === 'Gasto')
            .reduce((acc, m) => {
              acc[m.categoria] = (acc[m.categoria] || 0) + m.valor;
              return acc;
            }, {});

          const listaRubros = Object.entries(rubrosAgrupados).sort((a, b) => b[1] - a[1]);

          const totalDeudasGrafico = totalCxCPendiente + totalCxPPendiente;
          const pctCxC = totalDeudasGrafico > 0 ? Math.round((totalCxCPendiente / totalDeudasGrafico) * 100) : 50;
          const pctCxP = totalDeudasGrafico > 0 ? Math.round((totalCxPPendiente / totalDeudasGrafico) * 100) : 50;

          return (
            <div className="flex flex-col h-full bg-[#F3F7F2] relative w-full">
              {/* Header */}
              <div className="p-4 pb-2 text-center">
                <h1 className="text-3xl font-extrabold text-[#1B4332]">MIA</h1>
                <p className="text-xs font-semibold text-[#40916C]">Mi Inteligencia de Ahorro</p>
              </div>

              {/* Contenido scrolleable */}
              <div className="flex-1 overflow-y-auto p-4 pb-24">
                {/* --- INICIO --- */}
                {tab === 'inicio' && (
                  <div>
                    <div className="bg-[#1B4332] rounded-2xl p-5 mb-4 shadow-md text-white">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-[11px] font-bold text-[#B7E4C7] tracking-wider">PATRIMONIO TOTAL DISPONIBLE</span>
                        <button onClick={() => setTab('cuentas')} className="text-[#B7E4C7] text-xs font-bold hover:underline">⚙️ Ajustar saldos</button>
                      </div>
                      <h2 className="text-3xl font-extrabold my-2">{formatoCOP(patrimonioTotal)}</h2>

                {tab === 'reportes' && (
                  <div>
                    <h3 className="text-[17px] font-bold text-[#1B4332] mb-3">Reportes y Estado de Deudas</h3>

                    {/* REPORTE DETALLADO POR TERCERO */}
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4">
                      <h4 className="text-sm font-bold text-[#1B4332] mb-2">📑 Reporte Detallado por Tercero (CxC / CxP)</h4>
                      <div className="flex gap-2 mb-2">
                        <select value={tipoReporteTercero} onChange={(e) => { setTipoReporteTercero(e.target.value); setTerceroSeleccionadoId(''); }} className="flex-1 bg-[#F8FAF8] rounded-lg p-2 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none font-semibold">
                          <option value="CxC">Cuentas por Cobrar</option>
                          <option value="CxP">Cuentas por Pagar</option>
                        </select>
                        <select value={terceroSeleccionadoId} onChange={(e) => setTerceroSeleccionadoId(e.target.value)} className="flex-1 bg-[#F8FAF8] rounded-lg p-2 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none">
                          <option value="">-- Seleccionar Tercero --</option>
                          {(tipoReporteTercero === 'CxC' ? cuentasPorCobrar : cuentasPorPagar).map(item => (
                            <option key={item.id} value={item.id}>{item.tercero} ({item.concepto})</option>
                          ))}
                        </select>
                      </div>

                      {terceroSeleccionadoId && (() => {
                        const itemSel = (tipoReporteTercero === 'CxC' ? cuentasPorCobrar : cuentasPorPagar).find(c => c.id.toString() === terceroSeleccionadoId);
                        if (!itemSel) return null;
                        return (
                          <div className="mt-3 p-3 bg-[#F8FAF8] rounded-xl border border-slate-200 space-y-2">
                            <p className="text-xs font-bold text-[#1F2937]">👤 Tercero: {itemSel.tercero}</p>
                            <p className="text-xs text-[#52725F]">Concepto: {itemSel.concepto}</p>
                            <p className="text-xs text-slate-600">📅 Fecha Inicial: {itemSel.fechaInicial || 'N/A'} · Vence: {itemSel.vencimiento}</p>
                            <p className="text-xs font-bold">Valor Total Inicial: {formatoCOP(itemSel.valorTotal)}</p>
                            <p className="text-xs font-bold text-[#C94A4A]">Saldo Pendiente Actual: {formatoCOP(itemSel.saldoPendiente)}</p>
                            <p className="text-xs text-slate-500">Estado: <span className="font-bold">{itemSel.estado}</span></p>
                            {itemSel.observacion && <p className="text-xs italic text-slate-500">Nota: {itemSel.observacion}</p>}

                            <div className="mt-3 pt-2 border-t border-slate-200">
                              <p className="text-[11px] font-bold text-[#1B4332] mb-1">📜 Historial de Movimientos:</p>
                              <div className="text-[11px] space-y-1 bg-white p-2 rounded-lg border border-slate-100">
                                <p className="text-emerald-700 font-semibold">🟢 {itemSel.fechaInicial || 'Inicio'} — Saldo Inicial: +{formatoCOP(itemSel.valorTotal)}</p>
                                {(itemSel.historialPagos || []).map((p, idx) => (
                                  <p key={idx} className="text-red-600 font-semibold">
                                    🔴 {p.fecha} — Abono ({p.cuentaName}): -{formatoCOP(p.monto)}
                                  </p>
                                ))}
                              </div>
                            </div>

                            <div className="flex gap-2 pt-2">
                              <button onClick={() => exportarCSV(itemSel)} className="flex-1 bg-[#205B43] text-white py-2 rounded-lg text-xs font-bold hover:bg-[#1B4332] transition">
                                📊 Exportar a Excel (CSV)
                              </button>
                              <button onClick={() => exportarPDF(itemSel)} className="flex-1 bg-[#40916C] text-white py-2 rounded-lg text-xs font-bold hover:bg-[#2D6A4F] transition">
                                📄 Exportar a PDF
                              </button>
                            </div>
                          </div>
                        );
                      })()}
                    </div>

                    {/* GRÁFICO RESUMEN CONSOLIDADO DE DEUDAS (CXC VS CXP) */}
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4">
                      <h4 className="text-sm font-bold text-[#1B4332] mb-3">📊 Balance General de Deudas</h4>
                      
                      <div className="flex justify-between items-center mb-1 text-xs">
                        <span className="font-semibold text-[#2D6A4F]">📥 CxC: {formatoCOP(totalCxCPendiente)} ({pctCxC}%)</span>
                        <span className="font-semibold text-[#C94A4A]">📤 CxP: {formatoCOP(totalCxPPendiente)} ({pctCxP}%)</span>
                      </div>

                      <div className="h-4 flex rounded-lg overflow-hidden bg-[#E2E8F0] mb-3">
                        <div style={{ width: `${pctCxC}%`, backgroundColor: '#2D6A4F' }} className="h-full transition-all"></div>
                        <div style={{ width: `${pctCxP}%`, backgroundColor: '#C94A4A' }} className="h-full transition-all"></div>
                      </div>

                      <div className="flex justify-between text-[11px] text-slate-500 font-medium">
                        <span>Total por Cobrar</span>
                        <span>Total por Pagar</span>
                      </div>
                    </div>

                    <h3 className="text-[17px] font-bold text-[#1B4332] mb-3 mt-6">Reporte Financiero por Fechas</h3>

                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-3">
                      <label className="text-xs font-semibold text-[#52725F] block mb-2">Período de consulta (AAAA-MM-DD):</label>
                      <div className="flex gap-2 mb-2">
                        <div className="flex-1">
                          <span className="text-[11px] font-semibold text-[#718078] block mb-1">Fecha Desde:</span>
                          <input type="text" value={fechaDesde} onChange={(e) => setFechaDesde(e.target.value)} className="w-full bg-[#F8FAF8] rounded-lg p-2.5 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none" />
                        </div>
                        <div className="flex-1">
                          <span className="text-[11px] font-semibold text-[#718078] block mb-1">Fecha Hasta:</span>
                          <input type="text" value={fechaHasta} onChange={(e) => setFechaHasta(e.target.value)} className="w-full bg-[#F8FAF8] rounded-lg p-2.5 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none" />
                        </div>
                      </div>

                      <div className="flex gap-2">
                        <button onClick={() => { setFechaDesde(fechaHoy()); setFechaHasta(fechaHoy()); }} className="flex-1 py-1.5 bg-[#E8EFE9] rounded-lg text-xs font-bold text-[#205B43] hover:bg-slate-200 transition">Hoy</button>
                        <button onClick={() => { setFechaDesde(primerDiaMes()); setFechaHasta(fechaHoy()); }} className="flex-1 py-1.5 bg-[#E8EFE9] rounded-lg text-xs font-bold text-[#205B43] hover:bg-slate-200 transition">Este Mes</button>
                        <button onClick={() => { setFechaDesde('2026-01-01'); setFechaHasta('2026-12-31'); }} className="flex-1 py-1.5 bg-[#E8EFE9] rounded-lg text-xs font-bold text-[#205B43] hover:bg-slate-200 transition">Todo el Año</button>
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-3">
                      <span className="text-[11px] font-bold text-[#718078]">GASTOS DEL PERÍODO</span>
                      <h2 className="text-2xl font-extrabold text-[#C94A4A] my-1">{formatoCOP(totalGastosReporte)}</h2>
                      <div className="border-t border-[#EEF2EE] pt-2 mt-2 space-y-1">
                        <p className="text-xs text-[#52725F] font-semibold">Ingresos en el rango: {formatoCOP(totalIngresosReporte)}</p>
                        <p className="text-xs text-[#52725F] font-semibold">Ahorro neto: {formatoCOP(totalIngresosReporte - totalGastosReporte)}</p>
                      </div>
                    </div>

                    <h3 className="text-[17px] font-bold text-[#1B4332] mt-4 mb-2">Distribución por Rubro ({listaRubros.length})</h3>

                    {totalGastosReporte === 0 ? (
                      <p className="text-center text-[#718078] my-6 italic text-sm">No existen gastos registrados entre {fechaDesde} y {fechaHasta}.</p>
                    ) : (
                      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                        <div className="h-4 flex rounded-lg overflow-hidden bg-[#E2E8F0] mb-4">
                          {listaRubros.map(([rubro, total], idx) => {
                            const pct = Math.max(1, Math.round((total / totalGastosReporte) * 100));
                            const paleta = ['#1B4332', '#2D6A4F', '#40916C', '#52B788', '#74C69D', '#95D5B2', '#B7E4C7'];
                            return <div key={rubro} style={{ width: `${pct}%`, backgroundColor: paleta[idx % paleta.length] }} className="h-full"></div>;
                          })}
                        </div>

                        {listaRubros.map(([rubro, total], idx) => {
                          const porcentaje = Math.round((total / totalGastosReporte) * 100);
                          const paleta = ['#1B4332', '#2D6A4F', '#40916C', '#52B788', '#74C69D', '#95D5B2', '#B7E4C7'];
                          const color = paleta[idx % paleta.length];

                          return (
                            <div key={rubro} className="mt-3">
                              <div className="flex justify-between items-center mb-1">
                                <div className="flex items-center">
                                  <div className="w-2.5 h-2.5 rounded-full mr-2" style={{ backgroundColor: color }}></div>
                                  <span className="text-xs font-semibold text-[#1F2937]">{rubro}</span>
                                </div>
                                <span className="text-xs font-bold text-[#52725F]">{formatoCOP(total)} ({porcentaje}%)</span>
                              </div>
                              <div className="h-1.5 bg-[#F1F5F1] rounded-full overflow-hidden">
                                <div className="h-full rounded-full" style={{ width: `${porcentaje}%`, backgroundColor: color }}></div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* --- MODAL EDITAR SALDO --- */}
              {modalEditarSaldo && (
                <div className="absolute inset-0 bg-black/50 flex justify-center items-center p-5 z-50">
                  <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl">
                    <h3 className="text-lg font-extrabold text-[#1B4332] text-center mb-2">Modificar Saldo Inicial</h3>
                    <p className="text-xs text-[#52725F] mb-3 text-center">Cuenta: <span className="font-bold">{cuentaAEditar?.nombre}</span></p>

                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Nuevo saldo de arranque en COP:</label>
                    <input type="text" value={saldoEditadoValorDisplay} onChange={(e) => setSaldoEditadoValorDisplay(formatearInputEnVivo(e.target.value))} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none mb-3" />

                    <div className="flex gap-2">
                      <button onClick={() => setModalEditarSaldo(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-sm hover:bg-slate-500 transition">Cancelar</button>
                      <button onClick={actualizarSaldoInicial} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-sm hover:bg-[#1B4332] transition">Guardar Saldo</button>
                    </div>
                  </div>
                </div>
              )}

              {/* --- MODAL NUEVA CUENTA --- */}
              {modalNuevaCuenta && (
                <div className="absolute inset-0 bg-black/50 flex justify-center items-center p-5 z-50">
                  <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl">
                    <h3 className="text-lg font-extrabold text-[#1B4332] text-center mb-3">Nueva Cuenta o Banco</h3>

                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Nombre de la cuenta:</label>
                    <input type="text" placeholder="Ej. Daviplata, BBVA" value={nuevoNombre} onChange={(e) => setNuevoNombre(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none mb-3" />

                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Tipo:</label>
                    <div className="flex gap-2 mb-3">
                      {['Banco', 'Billetera', 'Efectivo'].map((t) => (
                        <button key={t} onClick={() => setNuevoTipo(t)} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${nuevoTipo === t ? 'bg-[#205B43] text-white shadow' : 'bg-[#E8EFE9] text-[#205B43]'}`}>
                          {t}
                        </button>
                      ))}
                    </div>

                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Saldo inicial en COP:</label>
                    <input type="text" placeholder="Monto en pesos" value={nuevoSaldoInitDisplay} onChange={(e) => setNuevoSaldoInitDisplay(formatearInputEnVivo(e.target.value))} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none mb-3" />

                    <div className="flex gap-2">
                      <button onClick={() => setModalNuevaCuenta(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-sm hover:bg-slate-500 transition">Cancelar</button>
                      <button onClick={guardarNuevaCuenta} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-sm hover:bg-[#1B4332] transition">Crear Cuenta</button>
                    </div>
                  </div>
                </div>
              )}

              {/* --- NAVEGACIÓN INFERIOR (4 PESTAÑAS) --- */}
              <div className="absolute bottom-0 left-0 right-0 h-16 bg-white flex border-t border-[#E2E8F0] shadow-lg z-40">
                <button onClick={() => setTab('inicio')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'inicio' ? 'opacity-100 scale-110' : 'opacity-40'}`}>🏠</span>
                  <span className={`text-[10px] ${tab === 'inicio' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>Inicio</span>
                </button>
                <button onClick={() => setTab('cuentas')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'cuentas' ? 'opacity-100 scale-110' : 'opacity-40'}`}>🏦</span>
                  <span className={`text-[10px] ${tab === 'cuentas' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>Cuentas</span>
                </button>
                <button onClick={() => setTab('deudas')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'deudas' ? 'opacity-100 scale-110' : 'opacity-40'}`}>📑</span>
                  <span className={`text-[10px] ${tab === 'deudas' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>CxC / CxP</span>
                </button>
                <button onClick={() => setTab('reportes')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'reportes' ? 'opacity-100 scale-110' : 'opacity-40'}`}>📊</span>
                  <span className={`text-[10px] ${tab === 'reportes' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>Reportes</span>
                </button>
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
