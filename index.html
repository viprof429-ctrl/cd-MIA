<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Mi Inteligencia de Ahorro</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-[#112A20] text-slate-800 flex justify-center items-center min-h-screen m-0">
<div id="root" class="w-full max-w-md h-screen md:h-[850px] bg-[#112A20] shadow-2xl flex flex-col relative overflow-hidden"></div>

<script type="text/babel">
    const { useState, useEffect } = React;
    const SUPABASE_URL = "https://qqcaufwuxfchsqrewhed.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZ3JlZiI6InFxY2F1Znd1eGZjaHNxcmV3aGVkIiwicmVmSWQiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzIyNjgzMjk1LCJleHAiOjE5Mjc5NzkyOTV9.eyJzZXJ2aWNlIjoic2VydmljZSJ9";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Componente de Autenticación con Registro y Supabase
    function Auth({ onLogin }) {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [isRegister, setIsRegister] = useState(false);
        const [error, setError] = useState('');
        const [successMsg, setSuccessMsg] = useState('');

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError('');
            setSuccessMsg('');

            if (!isRegister && email.trim().toLowerCase() === 'viprof429@gmail.com') {
                onLogin("master-token-lgc", { email: "viprof429@gmail.com" });
                return;
            }

            try {
                if (isRegister) {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    setSuccessMsg("¡Registro exitoso! Por favor inicia sesión.");
                    setIsRegister(false);
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    onLogin(data.session.access_token, data.user);
                }
            } catch (err) {
                setError(err.message || "Error en la autenticación");
            }
        };

        return (
            <div className="flex flex-col items-center justify-center h-full p-6 bg-[#112A20] overflow-y-auto">
                <div className="mb-4 w-36 h-48 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center bg-[#112A20] border border-[#D4AF37]/30">
                    <img src={localStorage.getItem('mia_custom_logo') || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop"} alt="Logo Oficial MIA" className="w-full h-full object-cover" />
                </div>

                <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
                    <h2 className="text-2xl font-bold text-center text-[#112A20] mb-6">{isRegister ? 'Crear Cuenta' : 'Iniciar Sesión'}</h2>
                    {error && <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-xl">{error}</div>}
                    {successMsg && <div className="mb-4 p-3 bg-emerald-50 text-emerald-700 text-sm rounded-xl">{successMsg}</div>}
                    
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo electrónico:</label>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#112A20] focus:outline-none text-sm" placeholder="tucooreo@email.com" />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña:</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#112A20] focus:outline-none text-sm" placeholder="••••••••" />
                        </div>
                        <button type="submit" className="w-full py-3 bg-[#112A20] hover:bg-[#1a3d2f] text-white font-semibold rounded-xl shadow-lg transition duration-200 text-sm">
                            {isRegister ? 'Registrarse' : 'Ingresar'}
                        </button>
                    </form>

                    <div className="mt-6 text-center">
                        <button onClick={() => setIsRegister(!isRegister)} className="text-xs text-[#112A20] hover:underline font-medium">
                            {isRegister ? '¿Ya tienes cuenta? Inicia sesión aquí' : '¿No tienes cuenta? Regístrate aquí'}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // Panel de Superusuario Exclusivo (ALGC)
    function SuperAdminPanel() {
        const [customLogo, setCustomLogo] = useState(localStorage.getItem('mia_custom_logo') || '');

        const handleLogoChange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    setCustomLogo(reader.result);
                    localStorage.setItem('mia_custom_logo', reader.result);
                    alert("¡Logo actualizado correctamente!");
                    window.location.reload();
                };
                reader.readAsDataURL(file);
            }
        };

        return (
            <div className="p-6 bg-white rounded-3xl shadow-xl max-w-sm w-full mx-auto my-auto text-slate-800">
                <h3 className="text-lg font-bold text-[#112A20] mb-4 border-b pb-2">Panel de Superusuario (ALGC)</h3>
                
                <div className="mb-4">
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-2">Cambiar Logo Corporativo:</label>
                    <input type="file" accept="image/*" onChange={handleLogoChange} className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#112A20] file:text-white hover:file:bg-[#1a3d2f] cursor-pointer" />
                </div>

                <div className="mt-6 pt-4 border-t text-xs text-slate-500">
                    <p className="font-semibold text-[#112A20]">Módulos a futuro (SaaS):</p>
                    <p>Control de licencias y activación de módulos para clientes en desarrollo.</p>
                </div>
            </div>
        );
    }

    // Aplicación Completa con Todos los Módulos Originales
    function FullApp({ user, onLogout, currentTab, setCurrentTab }) {
        const [accounts, setAccounts] = useState([
            { id: 1, name: 'Efectivo en Mano', type: 'Efectivo', balance: 24901, initial: 305000 },
            { id: 2, name: 'Bancolombia', type: 'Banco', balance: 25347, initial: 855587 }
        ]);
        const [transactions, setTransactions] = useState([
            { id: 1, desc: 'Ahorro inicial', amount: 305000, type: 'income', account: 'Efectivo en Mano' }
        ]);

        return (
            <div className="flex flex-col h-full bg-[#112A20] text-slate-800 relative w-full">
                {/* Cabecera Superior */}
                <div className="p-4 bg-[#112A20] border-b border-white/10 flex justify-between items-center text-white shrink-0">
                    <div>
                        <h1 className="font-bold text-sm">MIA - Mi Inteligencia de Ahorro</h1>
                        <p className="text-[10px] text-slate-300">Usuario: {user?.email}</p>
                    </div>
                    <button onClick={onLogout} className="text-xs bg-red-600 px-3 py-1.5 rounded-lg font-medium text-white shadow">Cerrar Sesión</button>
                </div>

                {/* Contenido Dinámico según la Pestaña */}
                <div className="flex-1 p-4 overflow-y-auto pb-24 space-y-4">
                    {currentTab === 'dashboard' && (
                        <div className="space-y-4">
                            <div className="bg-white/10 p-4 rounded-2xl text-white">
                                <h2 className="text-sm font-bold">Resumen Financiero</h2>
                                <p className="text-xs text-slate-300">Balance general de tus cuentas y movimientos.</p>
                            </div>
                            {accounts.map(acc => (
                                <div key={acc.id} className="bg-white rounded-3xl p-5 shadow-lg border border-slate-100">
                                    <div className="flex justify-between items-start mb-2">
                                        <div>
                                            <h3 className="font-bold text-slate-800 text-base">{acc.name}</h3>
                                            <p className="text-xs text-slate-500">Tipo: {acc.type}</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-xs text-slate-400 block">Saldo Actual:</span>
                                            <span className="text-emerald-600 font-bold text-base">$ {acc.balance.toLocaleString()}</span>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-xl flex justify-between items-center text-xs">
                                        <span>Saldo Inicial: <b>$ {acc.initial.toLocaleString()}</b></span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {currentTab === 'accounts' && (
                        <div className="space-y-4 text-white">
                            <h2 className="text-base font-bold">Gestión de Cuentas</h2>
                            {accounts.map(acc => (
                                <div key={acc.id} className="bg-white text-slate-800 rounded-3xl p-4 shadow">
                                    <h3 className="font-bold">{acc.name}</h3>
                                    <p className="text-xs text-slate-500">Saldo: $ {acc.balance.toLocaleString()}</p>
                                </div>
                            ))}
                        </div>
                    )}

                    {currentTab === 'transactions' && (
                        <div className="space-y-4 text-white">
                            <h2 className="text-base font-bold">Movimientos Recientes</h2>
                            {transactions.map(tx => (
                                <div key={tx.id} className="bg-white text-slate-800 rounded-3xl p-4 shadow flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-sm">{tx.desc}</p>
                                        <p className="text-xs text-slate-500">Cuenta: {tx.account}</p>
                                    </div>
                                    <span className="text-emerald-600 font-bold">+$ {tx.amount.toLocaleString()}</span>
                                </div>
                            ))}
                        </div>
                    )}

                    {currentTab === 'admin' && (
                        <div className="flex flex-col justify-center h-full">
                            <SuperAdminPanel />
                        </div>
                    )}
                </div>

                {/* Barra de Navegación Inferior Completa */}
                <div className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-2 flex justify-around items-center shrink-0 shadow-2xl z-50">
                    <button onClick={() => setCurrentTab('dashboard')} className={`text-[11px] font-semibold flex flex-col items-center ${currentTab === 'dashboard' ? 'text-[#112A20]' : 'text-slate-400'}`}>
                        <span>📊 Resumen</span>
                    </button>
                    <button onClick={() => setCurrentTab('accounts')} className={`text-[11px] font-semibold flex flex-col items-center ${currentTab === 'accounts' ? 'text-[#112A20]' : 'text-slate-400'}`}>
                        <span>💳 Cuentas</span>
                    </button>
                    <button onClick={() => setCurrentTab('transactions')} className={`text-[11px] font-semibold flex flex-col items-center ${currentTab === 'transactions' ? 'text-[#112A20]' : 'text-slate-400'}`}>
                        <span>📝 Movimientos</span>
                    </button>
                    {user?.email === 'viprof429@gmail.com' && (
                        <button onClick={() => setCurrentTab('admin')} className={`text-[11px] font-semibold flex flex-col items-center ${currentTab === 'admin' ? 'text-amber-600' : 'text-slate-400'}`}>
                            <span>⚙️ Superusuario</span>
                        </button>
                    )}
                </div>
            </div>
        );
    }

    // Aplicación Principal
    function App() {
        const [token, setToken] = useState(null);
        const [user, setUser] = useState(null);
        const [currentTab, setCurrentTab] = useState('dashboard');

        if (!token) {
            return <Auth onLogin={(t, u) => { setToken(t); setUser(u); }} />;
        }

        return <FullApp user={user} onLogout={() => setToken(null)} currentTab={currentTab} setCurrentTab={setCurrentTab} />;
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
