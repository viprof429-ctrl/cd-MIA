<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Mi Inteligencia de Ahorro</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-[#112A20] text-slate-800 flex justify-center items-center min-h-screen m-0">
<div id="root" class="w-full max-w-md h-screen md:h-[850px] bg-[#112A20] shadow-2xl flex flex-col relative overflow-hidden"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const SUPABASE_URL = "https://qqcaufwuxfchsqrewhed.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZ3JlZiI6InFxY2F1Znd1eGZjaHNxcmV3aGVkIiwicmVmSWQiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzIyNjgzMjk1LCJleHAiOjE5Mjc5NzkyOTV9.eyJzZXJ2aWNlIjoic2VydmljZSJ9";

    // Componente de Autenticación con Logo Fijo y Seguro
    function Auth({ onLogin }) {
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [isRegister, setIsRegister] = useState(false);
        const [error, setError] = useState('');
        const [successMsg, setSuccessMsg] = useState('');

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError('');
            setSuccessMsg('');
            const endpoint = isRegister ? `${SUPABASE_URL}/auth/v1/signup` : `${SUPABASE_URL}/auth/v1/token?grant_type=password`;
            
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error_description || data.msg || "Error en la autenticación");

                if (isRegister) {
                    setSuccessMsg("¡Registro exitoso! Por favor inicia sesión.");
                    setIsRegister(false);
                } else {
                    onLogin(data.access_token, data.user);
                }
            } catch (err) {
                setError(err.message);
            }
        };

        return (
            <div className="flex flex-col items-center justify-center h-full p-6 bg-[#112A20]">
                {/* Logo Fijo y Seguro (Sin botón de cambio) */}
                <div className="mb-6 w-32 h-44 rounded-2xl overflow-hidden shadow-2xl border border-[#D4AF37]/30 flex items-center justify-center bg-[#112A20]">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop" alt="Logo MIA" className="w-full h-full object-cover" />
                </div>

                <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
                    <h2 className="text-2xl font-bold text-center text-[#112A20] mb-6">{isRegister ? 'Crear Cuenta' : 'Iniciar Sesión'}</h2>
                    {error && <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-xl">{error}</div>}
                    {successMsg && <div className="mb-4 p-3 bg-emerald-50 text-emerald-700 text-sm rounded-xl">{successMsg}</div>}
                    
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div>
                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo electrónico:</label>
                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#112A20] focus:outline-none text-sm" placeholder="tucooreo@email.com" />
                        </div>
                        <div>
                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña:</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#112A20] focus:outline-none text-sm" placeholder="••••••••" />
                        </div>
                        <button type="submit" className="w-full py-3 bg-[#112A20] hover:bg-[#1a3d2f] text-white font-semibold rounded-xl shadow-lg transition duration-200 text-sm">
                            {isRegister ? 'Registrarse' : 'Ingresar'}
                        </button>
                    </form>

                    <div className="mt-6 text-center">
                        <button onClick={() => setIsRegister(!isRegister)} className="text-xs text-[#112A20] hover:underline font-medium">
                            {isRegister ? '¿Ya tienes cuenta? Inicia sesión aquí' : '¿No tienes cuenta? Regístrate aquí'}
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    // Aplicación Principal
    function App() {
        const [token, setToken] = useState(null);
        const [user, setUser] = useState(null);

        if (!token) {
            return <Auth onLogin={(t, u) => { setToken(t); setUser(u); }} />;
        }

        return (
            <div className="flex flex-col h-full bg-[#112A20] text-slate-800">
                <div className="p-4 bg-white/10 flex justify-between items-center text-white">
                    <span className="font-bold text-sm">MIA - Panel Principal (ALGC)</span>
                    <button onClick={() => setToken(null)} className="text-xs bg-red-600 px-3 py-1.5 rounded-lg font-medium">Cerrar Sesión</button>
                </div>
                <div className="flex-1 p-6 flex flex-col items-center justify-center text-white">
                    <h1 className="text-xl font-bold mb-2">¡Bienvenido, ALGC!</h1>
                    <p className="text-sm text-slate-300 text-center">Aplicación actualizada correctamente con los botones y seguridad aplicada.</p>
                </div>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
