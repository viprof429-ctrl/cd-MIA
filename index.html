        const supabaseApi = {
          async signUp(email, password, extraData) {
            try {
              const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ email, password, data: extraData })
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data.msg || data.error_description || 'Error en el registro');
              
              if (data.id || data.user?.id) {
                const uid = data.id || data.user.id;
                await fetch(`${SUPABASE_URL}/rest/v1/mia_datos_usuario`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Prefer': 'return=minimal'
                  },
                  body: JSON.stringify({
                    user_id: uid,
                    correo: email,
                    data: { cuentas: CUENTAS_BASE, movimientos: [], cuentasPorCobrar: [], cuentasPorPagar: [], moneda: extraData?.moneda || 'COP ($)', idioma: extraData?.idioma || 'Español', correo: email }
                  })
                });
              }

              return { data, error: null };
            } catch (err) {
              return { data: null, error: err };
            }
          },
          async signIn(email, password) {
            try {
              const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ email, password })
              });
              const data = await res.json();
              if (!res.ok) {
                throw new Error(data.error_description || data.msg || data.message || 'Credenciales inválidas');
              }
              return { data, error: null };
            } catch (err) {
              return { data: null, error: err };
            }
          },
          async cargarDatosNube(token, userId) {
            try {
              const res = await fetch(`${SUPABASE_URL}/rest/v1/mia_datos_usuario?user_id=eq.${userId}&select=data`, {
                method: 'GET',
                headers: {
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${token}`
                }
              });
              if (!res.ok) return null;
              const rows = await res.json();
              if (rows && rows.length > 0) {
                let rawData = rows[0].data;
                
                let cuentasExtraidas = CUENTAS_BASE;
                if (Array.isArray(rawData)) {
                  cuentasExtraidas = rawData;
                } else if (rawData && Array.isArray(rawData.cuentas)) {
                  cuentasExtraidas = rawData.cuentas;
                }

                cuentasExtraidas = cuentasExtraidas.map(c => ({
                  ...c,
                  saldoInicial: Number(c.saldoInicial !== undefined ? c.saldoInicial : (c.saldoinicial !== undefined ? c.saldoinicial : 0)),
                  fechaSaldoInicial: c.fechaSaldoInicial || fechaHoy()
                }));

                return {
                  cuentas: cuentasExtraidas,
                  movimientos: rawData?.movimientos || [],
                  cuentasPorCobrar: rawData?.cuentasPorCobrar || [],
                  cuentasPorPagar: rawData?.cuentasPorPagar || [],
                  moneda: rawData?.moneda,
                  idioma: rawData?.idioma
                };
              }
              return null;
            } catch (err) {
              console.error("Error cargando de la nube:", err);
              return null;
            }
          },
          async guardarDatosNube(token, userId, payload) {
            try {
              const res = await fetch(`${SUPABASE_URL}/rest/v1/mia_datos_usuario?user_id=eq.${userId}`, {
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${token}`,
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                  correo: payload.correo,
                  data: payload.data
                })
              });

              if (!res.ok) {
                await fetch(`${SUPABASE_URL}/rest/v1/mia_datos_usuario`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${token}`,
                    'Prefer': 'return=minimal'
                  },
                  body: JSON.stringify({
                    user_id: userId,
                    correo: payload.correo,
                    data: payload.data
                  })
                });
              }
            } catch (err) {
              console.error("Error guardando en la nube:", err);
            }
          },
          async cargarLogoGlobal() {
            try {
              const res = await fetch(`${SUPABASE_URL}/rest/v1/mia_configuracion?select=valor&clave=eq.logo_global`, {
                method: 'GET',
                headers: { 'apikey': SUPABASE_ANON_KEY }
              });
              if (!res.ok) return null;
              const rows = await res.json();
              if (rows && rows.length > 0) return rows[0].valor;
            } catch (err) {
              console.error("Error cargando logo global:", err);
            }
            return null;
          },
          async guardarLogoGlobal(token, logoBase64) {
            try {
              const resPatch = await fetch(`${SUPABASE_URL}/rest/v1/mia_configuracion?clave=eq.logo_global`, {
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${token}`,
                  'Prefer': 'return=representation'
                },
                body: JSON.stringify({ valor: logoBase64 })
              });
              const updatedRows = await resPatch.json();
              if (updatedRows && updatedRows.length > 0) return true;

              const resPost = await fetch(`${SUPABASE_URL}/rest/v1/mia_configuracion`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${token}`,
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ clave: 'logo_global', valor: logoBase64 })
              });
              return resPost.ok;
            } catch (err) {
              console.error("Error guardando logo global en nube:", err);
              return false;
            }
          },
          async obtenerUsuariosRegistrados(token) {
            try {
              const res = await fetch(`${SUPABASE_URL}/rest/v1/mia_datos_usuario?select=*`, {
                method: 'GET',
                headers: {
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${token}`,
                  'Range': '0-999'
                }
              });
              if (!res.ok) return [];
              const rawData = await res.json();

              return rawData.map(usr => {
                let correoDetectado = usr.correo || usr.data?.correo;
                if (!correoDetectado || !correoDetectado.includes('@')) {
                  if (usr.user_id === '86cd0012-58c7-489d-b03d-36349412aa25') {
                    correoDetectado = 'viprof429@gmail.com';
                  } else if (usr.user_id === 'cdc21ebb-372d-48f8-b94e-b303f9dcf140') {
                    correoDetectado = 'alvaroluis29@hotmail.com';
                  } else {
                    correoDetectado = `usuario_${usr.user_id.substring(0, 6)}@mia.app`;
                  }
                }
                return {
                  ...usr,
                  correo: correoDetectado,
                  data: { ...usr.data, correo: correoDetectado }
                };
              });
            } catch (err) {
              console.error("Error obteniendo usuarios:", err);
              return [];
            }
          }
        };

          { id: '1', nombre: 'Efectivo en Mano', tipo: 'Efectivo', saldoInicial: 0, fechaSaldoInicial: fechaHoy(), icono: '💵' },
          { id: '2', nombre: 'Bancolombia', tipo: 'Banco', saldoInicial: 0, fechaSaldoInicial: fechaHoy(), icono: '🏦' },
          { id: '3', nombre: 'Nequi', tipo: 'Billetera', saldoInicial: 0, fechaSaldoInicial: fechaHoy(), icono: '📱' },
        ];

        const CATEGORIAS_GASTO_BASE = [
          'Alimentación', 'Transporte', 'Servicios / Hogar', 'Ocio / Salidas', 'Salud', 'Educación', 'Otros Gastos'
        ];

        const CATEGORIAS_INGRESO_BASE = [
          'Salario / Nómina', 'Ventas / Negocio', 'Otros Ingresos'
        ];

        const formatoCOP = (valor, monedaSimbolo = '$') => {
          if (isNaN(valor) || valor === null || valor === undefined) return `${monedaSimbolo} 0`;
          const signo = valor < 0 ? '-' : '';
          const valorAbs = Math.abs(Math.round(valor));
          const partes = valorAbs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          return `${signo}${monedaSimbolo} ${partes}`;
        };

        const formatearInputEnVivo = (inputStr) => {
          if (!inputStr) return '';
          const limpio = inputStr.toString().replace(/\D/g, '');
          if (!limpio) return '';
          return Number(limpio).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        };

        const obtenerNumeroLimpio = (inputStr) => {
          if (!inputStr) return 0;
          return parseInt(inputStr.toString().replace(/\D/g, ''), 10) || 0;
        };

        const fechaHoy = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const dia = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${dia}`;
        };

        const primerDiaMes = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          return `${y}-${m}-01`;
        };

        const notificar = (titulo, mensaje) => {
          if (typeof window !== 'undefined') {
            window.alert(`${titulo}\n\n${mensaje}`);
          }
        };

        function App() {
          const [sesion, setSesion] = useState(() => {
            const saved = localStorage.getItem('mia_sesion');
            return saved ? JSON.parse(saved) : null;
          });
          const [emailInput, setEmailInput] = useState('');
          const [passInput, setPassInput] = useState('');
          const [modoRegistro, setModoRegistro] = useState(false);

          const [idiomaSeleccionado, setIdiomaSeleccionado] = useState('Español');
          const [monedaSeleccionada, setMonedaSeleccionada] = useState('COP ($)');

          const [tab, setTab] = useState('inicio');
          const [logoGlobal, setLogoGlobal] = useState(null);
          const [listaUsuariosCloud, setListaUsuariosCloud] = useState([]);

          const [filtroFechaDesde, setFiltroFechaDesde] = useState('');
          const [filtroFechaHasta, setFiltroFechaHasta] = useState('');
          const [tipoBusqueda, setTipoBusqueda] = useState('correo');
          const [filtroCorreo, setFiltroCorreo] = useState('Todos');
          const [filtroIdioma, setFiltroIdioma] = useState('Todos');
          const [filtroMoneda, setFiltroMoneda] = useState('Todas');
          const [reporteGenerado, setReporteGenerado] = useState(false);

          const [cuentas, setCuentas] = useState(CUENTAS_BASE);
          const [movimientos, setMovimientos] = useState([]);
          const [cuentasPorCobrar, setCuentasPorCobrar] = useState([]);
          const [cuentasPorPagar, setCuentasPorPagar] = useState([]);

          const [categoriasGasto, setCategoriasGasto] = useState(CATEGORIAS_GASTO_BASE);
          const [categoriasIngreso, setCategoriasIngreso] = useState(CATEGORIAS_INGRESO_BASE);
          const [conceptosDeuda, setConceptosDeuda] = useState([...CATEGORIAS_GASTO_BASE, ...CATEGORIAS_INGRESO_BASE, 'Préstamo Personal', 'Inversión']);
          const [datosCargados, setDatosCargados] = useState(false);
          const datosCargadosRef = useRef(false);

          const t = T[idiomaSeleccionado] || T['Español'];

          useEffect(() => {
            supabaseApi.cargarLogoGlobal().then(logo => {
              if (logo) setLogoGlobal(logo);
            });
          }, []);

          useEffect(() => {
            if (sesion && sesion.access_token && !datosCargadosRef.current) {
              const userId = sesion.user_id;
              supabaseApi.cargarDatosNube(sesion.access_token, userId).then((cloudData) => {
                if (cloudData && cloudData.cuentas && cloudData.cuentas.length > 0) {
                  setCuentas(cloudData.cuentas);
                  setMovimientos(cloudData.movimientos || []);
                  setCuentasPorCobrar(cloudData.cuentasPorCobrar || []);
                  setCuentasPorPagar(cloudData.cuentasPorPagar || []);
                  if (cloudData.moneda) setMonedaSeleccionada(cloudData.moneda);
                  if (cloudData.idioma) setIdiomaSeleccionado(cloudData.idioma);
                }
                datosCargadosRef.current = true;
                setDatosCargados(true);
              });

              if (sesion.user?.email?.trim().toLowerCase() === 'viprof429@gmail.com') {
                supabaseApi.obtenerUsuariosRegistrados(sesion.access_token).then(usuarios => {
                  setListaUsuariosCloud(usuarios);
                });
              }
            }
          }, [sesion]);

          useEffect(() => {
            if (sesion && sesion.access_token && datosCargados) {
              const userId = sesion.user_id || sesion.user.id;
              const correoUser = sesion.user?.email || emailInput;
              const payload = {
                correo: correoUser,
                data: { cuentas, movimientos, cuentasPorCobrar, cuentasPorPagar, moneda: monedaSeleccionada, idioma: idiomaSeleccionado, correo: correoUser }
              };
              supabaseApi.guardarDatosNube(sesion.access_token, userId, payload);
            }
          }, [cuentas, movimientos, cuentasPorCobrar, cuentasPorPagar, monedaSeleccionada, idiomaSeleccionado, datosCargados, sesion]);

          const manejarLogin = async () => {
            if (!emailInput || !passInput) {
              notificar('Datos incompletos', 'Ingresa tu correo y contraseña.');
              return;
            }
            const { data, error } = await supabaseApi.signIn(emailInput, passInput);
            if (error) {
              notificar('Error de Acceso', error.message);
            } else {
              const tokenValido = data.access_token || data.session?.access_token || data.token;
              const userIdValido = data.user?.id || data.session?.user?.id || data.id;
              const userSession = { 
                user: { email: emailInput }, 
                user_id: userIdValido, 
                access_token: tokenValido 
              };
              localStorage.clear();
              datosCargadosRef.current = false;
              setSesion(userSession);
              setDatosCargados(false);
              localStorage.setItem('mia_sesion', JSON.stringify(userSession));
            }
          };

          const manejarRegistro = async () => {
            if (!emailInput || !passInput) {
              notificar('Datos incompletos', 'Ingresa un correo y contraseña válidos.');
              return;
            }
            const extraData = { idioma: idiomaSeleccionado, moneda: monedaSeleccionada, correo: emailInput };
            const { error } = await supabaseApi.signUp(emailInput, passInput, extraData);
            if (error) {
              notificar('Error de Registro', error.message);
            } else {
              notificar('¡Registro exitoso!', 'Ya puedes iniciar sesión con tus datos.');
              setModoRegistro(false);
            }
          };

          const cerrarSesion = () => {
            localStorage.clear();
            datosCargadosRef.current = false;
            setSesion(null);
            setDatosCargados(false);
            setCuentas(CUENTAS_BASE);
            setMovimientos([]);
            setCuentasPorCobrar([]);
            setCuentasPorPagar([]);
          };

          const manejarSubidaLogoGlobal = (e) => {
            const archivo = e.target.files[0];
            if (!archivo) return;
            const lector = new FileReader();
            lector.onloadend = async () => {
              const base64String = lector.result;
              const img = new Image();
              img.src = base64String;
              img.onload = async () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 300;
                const MAX_HEIGHT = 300;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                  if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                  if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrlOptimizado = canvas.toDataURL('image/png');

                setLogoGlobal(dataUrlOptimizado);
                if (sesion && sesion.access_token) {
                  await supabaseApi.guardarLogoGlobal(sesion.access_token, dataUrlOptimizado);
                  notificar('¡Logotipo Global Actualizado!', 'Guardado en la nube y sincronizado para todos los usuarios.');
                }
              };
            };
            lector.readAsDataURL(archivo);
          };

          const simboloMoneda = monedaSeleccionada.includes('USD') ? '$' : monedaSeleccionada.includes('EUR') ? '€' : monedaSeleccionada.includes('MXN') ? '$' : '$';

          const [tipoMovimiento, setTipoMovimiento] = useState('Gasto');
          const [cuentaSeleccionada, setCuentaSeleccionada] = useState(cuentas[0]?.id || '1');
          const [categoriaSeleccionada, setCategoriaSeleccionada] = useState(categoriasGasto[0]);
          const [concepto, setConcepto] = useState('');
          const [valorDisplay, setValorDisplay] = useState('');
          const [fechaMovimiento, setFechaMovimiento] = useState(fechaHoy());

          const [modalEditarMovimiento, setModalEditarMovimiento] = useState(false);
          const [movimientoAEditar, setMovimientoAEditar] = useState(null);
          const [editConcepto, setEditConcepto] = useState('');
          const [editValorDisplay, setEditValorDisplay] = useState('');
          const [editFecha, setEditFecha] = useState('');
          const [editTipo, setEditTipo] = useState('Gasto');
          const [editCuentaId, setEditCuentaId] = useState('');
          const [editCategoria, setEditCategoria] = useState('');

          const [modalNuevaCuenta, setModalNuevaCuenta] = useState(false);
          const [nuevoNombre, setNuevoNombre] = useState('');
          const [nuevoTipo, setNuevoTipo] = useState('Banco');
          const [nuevoSaldoInitDisplay, setNuevoSaldoInitDisplay] = useState('');

          const [modalEditarSaldo, setModalEditarSaldo] = useState(false);
          const [cuentaAEditar, setCuentaAEditar] = useState(null);
          const [saldoEditadoValorDisplay, setSaldoEditadoValorDisplay] = useState('');
          const [fechaSaldoEditado, setFechaSaldoEditado] = useState(fechaHoy());

          const [fechaDesde, setFechaDesde] = useState('');
          const [fechaHasta, setFechaHasta] = useState('');

          const obtenerSaldoCuenta = (cuentaId) => {
            const c = cuentas.find((item) => item.id === cuentaId);
            if (!c) return 0;
            const ing = movimientos
              .filter((m) => m.cuentaId === cuentaId && m.tipo === 'Ingreso')
              .reduce((acc, m) => acc + m.valor, 0);
            const gas = movimientos
              .filter((m) => m.cuentaId === cuentaId && m.tipo === 'Gasto')
              .reduce((acc, m) => acc + m.valor, 0);
            return (c.saldoInicial || 0) + ing - gas;
          };

          const patrimonioTotal = cuentas.reduce((acc, c) => acc + obtenerSaldoCuenta(c.id), 0);
          const totalCxCPendiente = cuentasPorCobrar.reduce((acc, item) => acc + item.saldoPendiente, 0);
          const totalCxPPendiente = cuentasPorPagar.reduce((acc, item) => acc + item.saldoPendiente, 0);

          const guardarMovimiento = () => {
            const num = obtenerNumeroLimpio(valorDisplay);
            if (!concepto.trim() || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Escribe un concepto y un valor numérico válido.');
              return;
            }
            const nuevo = {
              id: Date.now(),
              cuentaId: cuentaSeleccionada,
              categoria: categoriaSeleccionada,
              concepto: concepto.trim(),
              valor: num,
              tipo: tipoMovimiento,
              fecha: fechaMovimiento.trim() || fechaHoy(),
            };
            setMovimientos((prev) => [nuevo, ...prev]);
            setConcepto('');
            setValorDisplay('');
            notificar('¡Registrado!', `${tipoMovimiento} guardado con éxito.`);
          };

          const abrirModalEditarMovimiento = (m) => {
            setMovimientoAEditar(m);
            setEditConcepto(m.concepto);
            setEditValorDisplay(formatearInputEnVivo(m.valor));
            setEditFecha(m.fecha);
            setEditTipo(m.tipo);
            setEditCuentaId(m.cuentaId);
            setEditCategoria(m.categoria);
            setModalEditarMovimiento(true);
          };

          const guardarEdicionMovimiento = () => {
            if (!movimientoAEditar) return;
            const num = obtenerNumeroLimpio(editValorDisplay);
            if (!editConcepto.trim() || isNaN(num) || num <= 0) {
              notificar('Datos inválidos', 'Ingresa un concepto y un valor válido.');
              return;
            }
            setMovimientos(prev => prev.map(m => m.id === movimientoAEditar.id ? {
              ...m,
              concepto: editConcepto.trim(),
              valor: num,
              fecha: editFecha || fechaHoy(),
              tipo: editTipo,
              cuentaId: editCuentaId,
              categoria: editCategoria
            } : m));
            setModalEditarMovimiento(false);
            setMovimientoAEditar(null);
            notificar('Movimiento Actualizado', 'Los cambios se guardaron correctamente.');
          };

          const eliminarMovimiento = (id) => {
            if (window.confirm('¿Estás seguro de eliminar este movimiento?')) {
              setMovimientos(prev => prev.filter(m => m.id !== id));
              notificar('Eliminado', 'El movimiento ha sido borrado.');
            }
          };

          const actualizarSaldoInicial = () => {
            if (!cuentaAEditar) return;
            const nuevoMonto = obtenerNumeroLimpio(saldoEditadoValorDisplay);
            setCuentas((prev) =>
              prev.map((c) => (c.id === cuentaAEditar.id ? { ...c, saldoInicial: nuevoMonto, fechaSaldoInicial: fechaSaldoEditado } : c))
            );
            setModalEditarSaldo(false);
            setCuentaAEditar(null);
            notificar('Saldo Actualizado', 'El saldo inicial y su fecha han sido modificados.');
          };

          const guardarNuevaCuenta = () => {
            const saldo = obtenerNumeroLimpio(nuevoSaldoInitDisplay);
            if (!nuevoNombre.trim()) {
              notificar('Falta el nombre', 'Ingresa el nombre del banco o cuenta.');
              return;
            }
            const iconos = { Efectivo: '💵', Banco: '🏦', Billetera: '📱' };
            const nueva = {
              id: Date.now().toString(),
              nombre: nuevoNombre.trim(),
              tipo: nuevoTipo,
              saldoInicial: saldo,
              fechaSaldoInicial: fechaHoy(),
              icono: iconos[nuevoTipo],
            };
            setCuentas((prev) => [...prev, nueva]);
            setNuevoNombre('');
            setNuevoSaldoInitDisplay('');
            setModalNuevaCuenta(false);
          };

          const reiniciarTodo = () => {
            const confirmar = window.confirm('¿Deseas borrar todos tus movimientos y empezar en limpio?');
            if (confirmar) {
              setCuentas(CUENTAS_BASE);
              setMovimientos([]);
              setCuentasPorCobrar([]);
              setCuentasPorPagar([]);
              notificar('Reinicio completo', 'Tus datos se han reiniciado.');
            }
          };

          const cuentasConSaldo = cuentas.filter(c => obtenerSaldoCuenta(c.id) !== 0 || c.saldoInicial !== 0);

          if (!sesion) {
            return (
              <div className="flex flex-col h-full bg-[#112A20] justify-center items-center p-3 w-full text-white overflow-y-auto">
                <LogoOficialMIA logoCustom={logoGlobal} />

                <div className="bg-white text-slate-800 rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-3 shrink-0 mt-3">
                  <h2 className="text-lg font-bold text-center text-[#112A20]">
                    {modoRegistro ? 'Crea tu cuenta' : 'Iniciar Sesión'}
                  </h2>

                  <div>
                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Correo electrónico:</label>
                    <input 
                      type="email" 
                      placeholder="tucorreo@email.com" 
                      value={emailInput} 
                      onChange={(e) => setEmailInput(e.target.value)} 
                      className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm outline-none" 
                    />
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Contraseña:</label>
                    <input 
                      type="password" 
                      placeholder="••••••••" 
                      value={passInput} 
                      onChange={(e) => setPassInput(e.target.value)} 
                      className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm outline-none" 
                    />
                  </div>

                  {modoRegistro && (
                    <div className="space-y-3 pt-1 border-t border-slate-100">
                      <div>
                        <label className="text-xs font-semibold text-[#52725F] block mb-1">🌐 Idioma de la plataforma:</label>
                        <select 
                          value={idiomaSeleccionado} 
                          onChange={(e) => setIdiomaSeleccionado(e.target.value)} 
                          className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm outline-none font-medium text-slate-700"
                        >
                          <option value="Español">🇪🇸 Español</option>
                          <option value="Inglés">🇺🇸 English</option>
                          <option value="Portugués">🇧🇷 Português</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-semibold text-[#52725F] block mb-1">💱 Tipo de Moneda:</label>
                        <select 
                          value={monedaSeleccionada} 
                          onChange={(e) => setMonedaSeleccionada(e.target.value)} 
                          className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm outline-none font-medium text-slate-700"
                        >
                          <option value="COP ($)">COP ($) - Peso Colombiano</option>
                          <option value="USD ($)">USD ($) - Dólar Estadounidense</option>
                          <option value="EUR (€)">EUR (€) - Euro</option>
                          <option value="MXN ($)">MXN ($) - Peso Mexicano</option>
                        </select>
                      </div>
                    </div>
                  )}

                  {modoRegistro ? (
                    <button onClick={manejarRegistro} className="w-full bg-[#205B43] text-white font-bold py-3 rounded-xl shadow hover:bg-[#112A20] transition mt-2">
                      Registrarse
                    </button>
                  ) : (
                    <button onClick={manejarLogin} className="w-full bg-[#205B43] text-white font-bold py-3 rounded-xl shadow hover:bg-[#112A20] transition mt-2">
                      Ingresar
                    </button>
                  )}

                  <button 
                    onClick={() => setModoRegistro(!modoRegistro)} 
                    className="w-full text-center text-xs text-[#2D6A4F] font-bold hover:underline pt-1"
                  >
                    {modoRegistro ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate aquí'}
                  </button>
                </div>
              </div>
            );
          }

          const esSuperAdmin = sesion?.user?.email?.trim().toLowerCase() === 'viprof429@gmail.com';

          return (
            <div className="flex flex-col h-full bg-[#F3F7F2] relative w-full">
              <div className="p-2 px-4 flex justify-between items-center bg-white border-b border-slate-100 shadow-sm">
                <LogoHeaderMIA logoCustom={logoGlobal} />
                <div className="flex items-center gap-2">
                    {esSuperAdmin && (
                        <button onClick={() => setTab('admin')} className="bg-[#D4AF37]/20 text-[#B8860B] px-3 py-1.5 rounded-xl text-xs font-bold border border-[#D4AF37]/50 hover:bg-[#D4AF37]/30 transition">
                            {t.superusuario}
                        </button>
                    )}
                    <button onClick={cerrarSesion} className="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold border border-red-200 hover:bg-red-100 transition">
                      {t.salir}
                    </button>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-4 pb-24">
                {tab === 'inicio' && (
                  <div>
                    <div className="bg-[#112A20] rounded-2xl p-5 mb-4 shadow-md text-white">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-[11px] font-bold text-[#B7E4C7] tracking-wider">{t.patrimonio} ({monedaSeleccionada})</span>
                        <button onClick={() => setTab('cuentas')} className="text-[#B7E4C7] text-xs font-bold hover:underline">{t.ajustarSaldos}</button>
                      </div>
                      <h2 className="text-3xl font-extrabold my-2">{formatoCOP(patrimonioTotal, simboloMoneda)}</h2>
                      <p className="text-[11px] text-[#D8F3DC]">{t.subPatrimonio}</p>
                    </div>

                    <div className="flex justify-between items-center mb-2">
                      <h3 className="text-[17px] font-bold text-[#112A20]">{t.fondosActivos}</h3>
                      <button onClick={() => setTab('cuentas')} className="text-xs text-[#2D6A4F] font-bold hover:underline">{t.verCuentas}</button>
                    </div>

                    <div className="grid grid-cols-2 gap-2 mb-4">
                      {cuentasConSaldo.length === 0 ? (
                        <p className="col-span-2 text-center text-xs text-[#718078] italic py-2">{t.sinCuentas}</p>
                      ) : (
                        cuentasConSaldo.map((c) => (
                          <div key={c.id} className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                            <div className="flex items-center gap-1.5">
                              <span className="text-xl">{c.icono}</span>
                              <p className="text-xs font-semibold text-slate-700 truncate">{c.nombre}</p>
                            </div>
                            <p className="text-[14px] font-bold text-[#205B43] mt-2">{formatoCOP(obtenerSaldoCuenta(c.id), simboloMoneda)}</p>
                          </div>
                        ))
                      )}
                    </div>

                    <h3 className="text-[17px] font-bold text-[#112A20] mt-4 mb-2">{t.registrarMov}</h3>
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                      <div className="flex gap-2">
                        <button
                          onClick={() => { setTipoMovimiento('Gasto'); setCategoriaSeleccionada(categoriasGasto[0]); }}
                          className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition ${tipoMovimiento === 'Gasto' ? 'bg-[#C94A4A] text-white shadow-md' : 'bg-[#E8EFE9] text-slate-700'}`}
                        >
                          {t.gasto}
                        </button>
                        <button
                          onClick={() => { setTipoMovimiento('Ingreso'); setCategoriaSeleccionada(categoriasIngreso[0]); }}
                          className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition ${tipoMovimiento === 'Ingreso' ? 'bg-[#2D6A4F] text-white shadow-md' : 'bg-[#E8EFE9] text-slate-700'}`}
                        >
                          {t.ingreso}
                        </button>
                      </div>

                      <div>
                        <label className="text-xs font-semibold text-[#52725F] block mb-1">{t.medioPago}</label>
                        <select
                          value={cuentaSeleccionada}
                          onChange={(e) => setCuentaSeleccionada(e.target.value)}
                          className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none font-medium"
                        >
                          {cuentas.map((c) => (
                            <option key={c.id} value={c.id}>{c.icono} {c.nombre}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-semibold text-[#52725F] block mb-1">{t.fecha}</label>
                        <input
                          type="text"
                          value={fechaMovimiento}
                          onChange={(e) => setFechaMovimiento(e.target.value)}
                          className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-semibold text-[#52725F] block mb-1">{t.rubro}</label>
                        <select
                          value={categoriaSeleccionada}
                          onChange={(e) => setCategoriaSeleccionada(e.target.value)}
                          className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none font-medium"
                        >
                          {(tipoMovimiento === 'Gasto' ? categoriasGasto : categoriasIngreso).map((cat) => (
                            <option key={cat} value={cat}>{cat}</option>
                          ))}
                        </select>
                      </div>

                      <input
                        type="text"
                        placeholder={t.conceptoPlaceholder}
                        value={concepto}
                        onChange={(e) => setConcepto(e.target.value)}
                        className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none placeholder-[#8F9F95]"
                      />

                      <input
                        type="text"
                        placeholder={t.valorPlaceholder(monedaSeleccionada)}
                        value={valorDisplay}
                        onChange={(e) => setValorDisplay(formatearInputEnVivo(e.target.value))}
                        className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none placeholder-[#8F9F95]"
                      />

                      <button
                        onClick={guardarMovimiento}
                        className="w-full bg-[#205B43] text-white font-bold py-3.5 rounded-xl shadow-md mt-2 hover:bg-[#112A20] transition"
                      >
                        {t.guardarMovBtn}
                      </button>
                    </div>

                    <h3 className="text-[17px] font-bold text-[#112A20] mt-4 mb-2">{t.movRecientes}</h3>
                    {movimientos.length === 0 ? (
                      <p className="text-center text-[#718078] my-6 italic text-sm">{t.sinMovs}</p>
                    ) : (
                      movimientos.slice(0, 5).map((m) => {
                        const cuentaAsociada = cuentas.find((c) => c.id === m.cuentaId);
                        const esIngreso = m.tipo === 'Ingreso';
                        return (
                          <div key={m.id} className="bg-white rounded-xl p-3.5 my-1.5 flex justify-between items-center shadow-sm border border-slate-100">
                            <div className="flex-1 pr-2">
                              <p className="text-sm font-semibold text-[#1F2937]">{m.concepto}</p>
                              <p className="text-[11px] text-[#718078] mt-0.5">📅 {m.fecha} · {cuentaAsociada?.nombre || 'Cuenta'} · {m.categoria}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className={`text-sm font-bold ${esIngreso ? 'text-[#2D6A4F] ' : 'text-[#C94A4A]'}`}>
                                {esIngreso ? '+ ' : '- '}{formatoCOP(m.valor, simboloMoneda)}
                              </span>
                              <button onClick={() => abrirModalEditarMovimiento(m)} className="p-1.5 bg-[#E8EFE9] text-[#205B43] rounded-lg text-xs font-bold hover:bg-slate-200 transition" title="Editar">✏️</button>
                              <button onClick={() => eliminarMovimiento(m.id)} className="p-1.5 bg-red-50 text-red-600 rounded-lg text-xs font-bold hover:bg-red-100 transition" title="Eliminar">🗑️</button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                )}

                {tab === 'cuentas' && (
                  <div>
                    <div className="flex justify-between items-center mb-3">
                      <h3 className="text-[17px] font-bold text-[#112A20]">{t.cuentasTitulo}</h3>
                      <button onClick={() => setModalNuevaCuenta(true)} className="bg-[#2D6A4F] text-white px-3.5 py-1.5 rounded-full text-xs font-bold shadow hover:bg-[#205B43] transition">
                        {t.crearCuentaBtn}
                      </button>
                    </div>

                    <p className="text-[13px] text-[#52725F] mb-4">{t.cuentasSub}</p>

                    {cuentas.map((c) => {
                      const saldoActual = obtenerSaldoCuenta(c.id);
                      return (
                        <div key={c.id} className="bg-white rounded-2xl p-4 my-3 shadow-sm border border-slate-100 space-y-3">
                          <div className="flex items-center">
                            <span className="text-3xl">{c.icono}</span>
                            <div className="ml-3 flex-1">
                              <h4 className="text-base font-bold text-[#1F2937]">{c.nombre}</h4>
                              <p className="text-xs text-[#718078]">Tipo: {c.tipo}</p>
                            </div>
                            <div className="text-right">
                              <span className="text-[11px] text-[#718078]">{t.saldoActual}</span>
                              <p className="text-base font-bold text-[#205B43]">{formatoCOP(saldoActual, simboloMoneda)}</p>
                            </div>
                          </div>

                          <div className="h-[1px] bg-[#EEF2EE]"></div>

                          <div className="flex justify-between items-center">
                            <div>
                              <span className="text-[10px] font-bold text-[#718078] tracking-wider">{t.saldoInicialLabel} (Desde: {c.fechaSaldoInicial || fechaHoy()})</span>
                              <p className="text-[14px] font-bold text-[#1F2937] mt-0.5">{formatoCOP(c.saldoInicial, simboloMoneda)}</p>
                            </div>
                            <button
                              onClick={() => { setCuentaAEditar(c); setSaldoEditadoValorDisplay(formatearInputEnVivo(c.saldoInicial)); setFechaSaldoEditado(c.fechaSaldoInicial || fechaHoy()); setModalEditarSaldo(true); }}
                              className="bg-[#E8EFE9] px-3 py-2 rounded-xl text-xs font-bold text-[#205B43] hover:bg-slate-200 transition"
                            >
                              {t.modificarBtn}
                            </button>
                          </div>
                        </div>
                      );
                    })}

                    <button onClick={reiniciarTodo} className="w-full mt-4 p-3 bg-[#FDE8E8] rounded-xl text-[#9B1C1C] font-bold text-xs border border-[#F8B4B4] hover:bg-red-100 transition">
                      {t.reiniciarCelularBtn}
                    </button>
                  </div>
                )}
              </div>

              {/* MODAL EDITAR SALDO INICIAL CON FECHA */}
              {modalEditarSaldo && (
                <div className="absolute inset-0 bg-black/50 flex justify-center items-center p-5 z-50">
                  <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl space-y-3">
                    <h3 className="text-lg font-extrabold text-[#112A20] text-center mb-1">Modificar Saldo Inicial</h3>
                    <p className="text-xs text-[#52725F] mb-2 text-center">Cuenta: <span className="font-bold">{cuentaAEditar?.nombre}</span></p>

                    <div>
                      <label className="text-xs font-semibold text-[#52725F] block mb-1">📅 Fecha de corte del saldo inicial:</label>
                      <input 
                        type="date" 
                        value={fechaSaldoEditado} 
                        onChange={(e) => setFechaSaldoEditado(e.target.value)} 
                        className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none font-semibold mb-2" 
                      />
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-[#52725F] block mb-1">Nuevo saldo de arranque:</label>
                      <input 
                        type="text" 
                        value={saldoEditadoValorDisplay} 
                        onChange={(e) => setSaldoEditadoValorDisplay(formatearInputEnVivo(e.target.value))} 
                        className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none mb-3 font-bold" 
                      />
                    </div>

                    <div className="flex gap-2">
                      <button onClick={() => setModalEditarSaldo(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-xs hover:bg-slate-500 transition">Cancelar</button>
                      <button onClick={actualizarSaldoInicial} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-xs hover:bg-[#112A20] transition">Guardar Saldo</button>
                    </div>
                  </div>
                </div>
              )}

              {modalNuevaCuenta && (
                <div className="absolute inset-0 bg-black/50 flex justify-center items-center p-5 z-50">
                  <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl">
                    <h3 className="text-lg font-extrabold text-[#112A20] text-center mb-3">Nueva Cuenta o Banco</h3>

                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Nombre de la cuenta:</label>
                    <input type="text" placeholder="Ej. Daviplata, BBVA" value={nuevoNombre} onChange={(e) => setNuevoNombre(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none mb-3" />

                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Tipo:</label>
                    <div className="flex gap-2 mb-3">
                      {['Banco', 'Billetera', 'Efectivo'].map((t) => (
                        <button key={t} onClick={() => setNuevoTipo(t)} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${nuevoTipo === t ? 'bg-[#205B43] text-white shadow' : 'bg-[#E8EFE9] text-[#205B43]'}`}>
                          {t}
                        </button>
                      ))}
                    </div>

                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Saldo inicial:</label>
                    <input type="text" placeholder="Monto inicial" value={nuevoSaldoInitDisplay} onChange={(e) => setNuevoSaldoInitDisplay(formatearInputEnVivo(e.target.value))} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none mb-3" />

                    <div className="flex gap-2">
                      <button onClick={() => setModalNuevaCuenta(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-sm hover:bg-slate-500 transition">Cancelar</button>
                      <button onClick={guardarNuevaCuenta} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-sm hover:bg-[#112A20] transition">Crear Cuenta</button>
                    </div>
                  </div>
                </div>
              )}

              <div className="absolute bottom-0 left-0 right-0 h-16 bg-white flex border-t border-[#E2E8F0] shadow-lg z-40">
                <button onClick={() => setTab('inicio')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'inicio' ? 'opacity-100 scale-110' : 'opacity-40'}`}>🏠</span>
                  <span className={`text-[10px] ${tab === 'inicio' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>{t.inicioNav}</span>
                </button>
                <button onClick={() => setTab('cuentas')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'cuentas' ? 'opacity-100 scale-110' : 'opacity-40'}`}>🏦</span>
                  <span className={`text-[10px] ${tab === 'cuentas' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>{t.cuentasNav}</span>
                </button>
                <button onClick={() => setTab('deudas')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'deudas' ? 'opacity-100 scale-110' : 'opacity-40'}`}>📑</span>
                  <span className={`text-[10px] ${tab === 'deudas' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>{t.deudasNav}</span>
                </button>
                <button onClick={() => setTab('reportes')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'reportes' ? 'opacity-100 scale-110' : 'opacity-40'}`}>📊</span>
                  <span className={`text-[10px] ${tab === 'reportes' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>{t.reportesNav}</span>
                </button>
                {esSuperAdmin && (
                    <button onClick={() => setTab('admin')} className="flex-1 flex flex-col items-center justify-center">
                      <span className={`text-lg transition ${tab === 'admin' ? 'opacity-100 scale-110' : 'opacity-40'}`}>⚙️</span>
                      <span className={`text-[10px] ${tab === 'admin' ? 'text-amber-600 font-extrabold' : 'text-[#718078] font-semibold'}`}>{t.adminNav}</span>
                    </button>
                )}
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
