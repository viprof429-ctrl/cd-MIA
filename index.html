<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Tu Dosis de Bienestar Financiero</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [transacciones, setTransacciones] = React.useState([
                { id: 1, tipo: 'ingreso', desc: 'Salario / Honorarios', monto: 2500000, categoria: 'Laboral' },
                { id: 2, tipo: 'egreso', desc: 'Supermercado y Víveres', monto: 450000, categoria: 'Alimentación' }
            ]);
            const [cuentasPorCobrar, setCuentasPorCobrar] = React.useState([
                { id: 1, cliente: 'Cliente A', monto: 300000, estado: 'Pendiente' }
            ]);
            const [cuentasPorPagar, setCuentasPorPagar] = React.useState([
                { id: 1, proveedor: 'Servicios de Internet', monto: 120000, estado: 'Pendiente' }
            ]);

            // Form inputs
            const [desc, setDesc] = React.useState('');
            const [monto, setMonto] = React.useState('');
            const [tipo, setTipo] = React.useState('ingreso');
            
            const [nombreCxC, setNombreCxC] = React.useState('');
            const [montoCxC, setMontoCxC] = React.useState('');

            const [nombreCxP, setNombreCxP] = React.useState('');
            const [montoCxP, setMontoCxP] = React.useState('');

            const totalIngresos = transacciones.filter(t => t.tipo === 'ingreso').reduce((acc, t) => acc + Number(t.monto), 0);
            const totalEgresos = transacciones.filter(t => t.tipo === 'egreso').reduce((acc, t) => acc + Number(t.monto), 0);
            const saldoTotal = totalIngresos - totalEgresos;

            const agregarTransaccion = (e) => {
                e.preventDefault();
                if (!desc || !monto) return;
                setTransacciones([...transacciones, { id: Date.now(), tipo, desc, monto: Number(monto), categoria: tipo === 'ingreso' ? 'Ingreso' : 'Egreso' }]);
                setDesc('');
                setMonto('');
            };

            const agregarCxC = (e) => {
                e.preventDefault();
                if (!nombreCxC || !montoCxC) return;
                setCuentasPorCobrar([...cuentasPorCobrar, { id: Date.now(), cliente: nombreCxC, monto: Number(montoCxC), estado: 'Pendiente' }]);
                setNombreCxC('');
                setMontoCxC('');
            };

            const agregarCxP = (e) => {
                e.preventDefault();
                if (!nombreCxP || !montoCxP) return;
                setCuentasPorPagar([...cuentasPorPagar, { id: Date.now(), proveedor: nombreCxP, monto: Number(montoCxP), estado: 'Pendiente' }]);
                setNombreCxP('');
                setMontoCxP('');
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl overflow-hidden">
                    {/* Header */}
                    <header className="bg-indigo-600 text-white p-5 shadow-md">
                        <h1 className="text-2xl font-black tracking-wide text-center">MIA</h1>
                        <p className="text-xs text-indigo-200 text-center mt-1">Tu Dosis de Bienestar Financiero</p>
                    </header>

                    {/* Navigation Bar */}
                    <nav className="flex bg-indigo-50 border-b border-indigo-100 text-xs font-semibold text-indigo-700 overflow-x-auto">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex-1 py-3 px-2 text-center whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow' : 'hover:bg-indigo-100'}`}>Inicio</button>
                        <button onClick={() => setActiveTab('ingresos')} className={`flex-1 py-3 px-2 text-center whitespace-nowrap ${activeTab === 'ingresos' ? 'bg-indigo-600 text-white shadow' : 'hover:bg-indigo-100'}`}>Ingresos</button>
                        <button onClick={() => setActiveTab('egresos')} className={`flex-1 py-3 px-2 text-center whitespace-nowrap ${activeTab === 'egresos' ? 'bg-indigo-600 text-white shadow' : 'hover:bg-indigo-100'}`}>Egresos</button>
                        <button onClick={() => setActiveTab('cxc')} className={`flex-1 py-3 px-2 text-center whitespace-nowrap ${activeTab === 'cxc' ? 'bg-indigo-600 text-white shadow' : 'hover:bg-indigo-100'}`}>Por Cobrar</button>
                        <button onClick={() => setActiveTab('cxp')} className={`flex-1 py-3 px-2 text-center whitespace-nowrap ${activeTab === 'cxp' ? 'bg-indigo-600 text-white shadow' : 'hover:bg-indigo-100'}`}>Por Pagar</button>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 p-4 overflow-y-auto pb-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="bg-gradient-to-br from-indigo-500 to-indigo-700 text-white p-5 rounded-2xl shadow-lg">
                                    <p className="text-xs text-indigo-100 uppercase tracking-wider font-medium">Saldo Disponible</p>
                                    <h2 className="text-3xl font-extrabold mt-1">${saldoTotal.toLocaleString()}</h2>
                                    <div className="flex justify-between mt-4 pt-4 border-t border-indigo-400/30 text-sm">
                                        <div>
                                            <p className="text-indigo-200 text-xs">Ingresos</p>
                                            <p className="font-bold text-emerald-300">+${totalIngresos.toLocaleString()}</p>
                                        </div>
                                        <div>
                                            <p className="text-indigo-200 text-xs">Egresos</p>
                                            <p className="font-bold text-rose-300">-${totalEgresos.toLocaleString()}</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <h3 className="font-bold text-slate-700 mb-2">Resumen General</h3>
                                    <p className="text-sm text-slate-500">Bienvenido a tu panel de control financiero. Navega por las pestañas superiores para registrar y consultar tus movimientos al instante.</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'ingresos' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">Gestión de Ingresos</h2>
                                <form onSubmit={agregarTransaccion} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                    <input type="hidden" value="ingreso" />
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Descripción del Ingreso</label>
                                        <input type="text" placeholder="Ej. Nómina, Ventas..." value={desc} onChange={e => setDesc(e.target.value)} className="w-full mt-1 p-2 border rounded-lg text-sm bg-white" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Monto ($)</label>
                                        <input type="number" placeholder="0" value={monto} onChange={e => setMonto(e.target.value)} className="w-full mt-1 p-2 border rounded-lg text-sm bg-white" />
                                    </div>
                                    <button type="submit" onClick={() => setTipo('ingreso')} className="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold text-sm shadow hover:bg-emerald-700">Registrar Ingreso</button>
                                </form>
                                <div className="space-y-2">
                                    <h3 className="text-sm font-bold text-slate-700">Historial de Ingresos</h3>
                                    {transacciones.filter(t => t.tipo === 'ingreso').map(t => (
                                        <div key={t.id} className="flex justify-between items-center p-3 bg-white border border-slate-100 rounded-lg shadow-sm">
                                            <span className="text-sm font-medium text-slate-700">{t.desc}</span>
                                            <span className="text-sm font-bold text-emerald-600">+${t.monto.toLocaleString()}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'egresos' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">Gestión de Egresos</h2>
                                <form onSubmit={agregarTransaccion} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Descripción del Gasto</label>
                                        <input type="text" placeholder="Ej. Arriendo, Comida..." value={desc} onChange={e => setDesc(e.target.value)} className="w-full mt-1 p-2 border rounded-lg text-sm bg-white" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Monto ($)</label>
                                        <input type="number" placeholder="0" value={monto} onChange={e => setMonto(e.target.value)} className="w-full mt-1 p-2 border rounded-lg text-sm bg-white" />
                                    </div>
                                    <button type="submit" onClick={() => setTipo('egreso')} className="w-full bg-rose-600 text-white py-2 rounded-lg font-semibold text-sm shadow hover:bg-rose-700">Registrar Egreso</button>
                                </form>
                                <div className="space-y-2">
                                    <h3 className="text-sm font-bold text-slate-700">Historial de Egresos</h3>
                                    {transacciones.filter(t => t.tipo === 'egreso').map(t => (
                                        <div key={t.id} className="flex justify-between items-center p-3 bg-white border border-slate-100 rounded-lg shadow-sm">
                                            <span className="text-sm font-medium text-slate-700">{t.desc}</span>
                                            <span className="text-sm font-bold text-rose-600">-${t.monto.toLocaleString()}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'cxc' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">Cuentas por Cobrar</h2>
                                <form onSubmit={agregarCxC} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Cliente / Deudor</label>
                                        <input type="text" placeholder="Nombre del cliente" value={nombreCxC} onChange={e => setNombreCxC(e.target.value)} className="w-full mt-1 p-2 border rounded-lg text-sm bg-white" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Monto por Cobrar ($)</label>
                                        <input type="number" placeholder="0" value={montoCxC} onChange={e => setMontoCxC(e.target.value)} className="w-full mt-1 p-2 border rounded-lg text-sm bg-white" />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold text-sm shadow hover:bg-blue-700">Agregar Cuenta por Cobrar</button>
                                </form>
                                <div className="space-y-2">
                                    <h3 className="text-sm font-bold text-slate-700">Listado Activo</h3>
                                    {cuentasPorCobrar.map(c => (
                                        <div key={c.id} className="flex justify-between items-center p-3 bg-white border border-slate-100 rounded-lg shadow-sm">
                                            <div>
                                                <p className="text-sm font-medium text-slate-700">{c.cliente}</p>
                                                <span className="text-xs text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full font-medium">{c.estado}</span>
                                            </div>
                                            <span className="text-sm font-bold text-blue-600">${c.monto.toLocaleString()}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'cxp' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">Cuentas por Pagar</h2>
                                <form onSubmit={agregarCxP} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Proveedor / Acreedor</label>
                                        <input type="text" placeholder="Nombre del proveedor" value={nombreCxP} onChange={e => setNombreCxP(e.target.value)} className="w-full mt-1 p-2 border rounded-lg text-sm bg-white" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-600">Monto por Pagar ($)</label>
                                        <input type="number" placeholder="0" value={montoCxP} onChange={e => setMontoCxP(e.target.value)} className="w-full mt-1 p-2 border rounded-lg text-sm bg-white" />
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold text-sm shadow hover:bg-indigo-700">Agregar Cuenta por Pagar</button>
                                </form>
                                <div className="space-y-2">
                                    <h3 className="text-sm font-bold text-slate-700">Listado Activo</h3>
                                    {cuentasPorPagar.map(c => (
                                        <div key={c.id} className="flex justify-between items-center p-3 bg-white border border-slate-100 rounded-lg shadow-sm">
                                            <div>
                                                <p className="text-sm font-medium text-slate-700">{c.proveedor}</p>
                                                <span className="text-xs text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full font-medium">{c.estado}</span>
                                            </div>
                                            <span className="text-sm font-bold text-indigo-600">${c.monto.toLocaleString()}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
