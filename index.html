     <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Mi Inteligencia de Ahorro</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F3F7F2] text-slate-800 flex justify-center items-center min-h-screen m-0">
    <div id="root" class="w-full max-w-md h-screen md:h-[850px] bg-[#F3F7F2] shadow-2xl flex flex-col relative overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CUENTAS_BASE = [
          { id: '1', nombre: 'Efectivo en Mano', tipo: 'Efectivo', saldoInicial: 0, icono: '💵' },
          { id: '2', nombre: 'Bancolombia', tipo: 'Banco', saldoInicial: 0, icono: '🏦' },
          { id: '3', nombre: 'Nequi', tipo: 'Billetera', saldoInicial: 0, icono: '📱' },
        ];

        const CATEGORIAS_GASTO = [
          'Alimentación', 'Transporte', 'Servicios / Hogar', 'Ocio / Salidas', 'Salud', 'Educación', 'Otros Gastos'
        ];

        const CATEGORIAS_INGRESO = [
          'Salario / Nómina', 'Ventas / Negocio', 'Otros Ingresos'
        ];

        const guardarEnStorage = (clave, valor) => {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              window.localStorage.setItem(clave, JSON.stringify(valor));
            }
          } catch (e) {}
        };

        const cargarDeStorage = (clave, valorPorDefecto) => {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              const data = window.localStorage.getItem(clave);
              if (data) return JSON.parse(data);
            }
          } catch (e) {}
          return valorPorDefecto;
        };

        const formatoCOP = (valor) => {
          if (isNaN(valor) || valor === null || valor === undefined) return '$ 0';
          const signo = valor < 0 ? '-' : '';
          const valorAbs = Math.abs(Math.round(valor));
          const partes = valorAbs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          return `${signo}$ ${partes}`;
        };

        const fechaHoy = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const dia = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${dia}`;
        };

        const primerDiaMes = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          return `${y}-${m}-01`;
        };

        const notificar = (titulo, mensaje) => {
          if (typeof window !== 'undefined') {
            window.alert(`${titulo}\n\n${mensaje}`);
          }
        };

        function App() {
          const [tab, setTab] = useState('inicio');

          const [cuentas, setCuentas] = useState(() =>
            cargarDeStorage('mia_cuentas_v2', CUENTAS_BASE)
          );

          const [movimientos, setMovimientos] = useState(() =>
            cargarDeStorage('mia_movimientos_v2', [])
          );

          const [cuentasPorCobrar, setCuentasPorCobrar] = useState(() =>
            cargarDeStorage('mia_cxco_v3', [])
          );

          const [cuentasPorPagar, setCuentasPorPagar] = useState(() =>
            cargarDeStorage('mia_cxpa_v3', [])
          );

          useEffect(() => {
            guardarEnStorage('mia_cuentas_v2', cuentas);
          }, [cuentas]);

          useEffect(() => {
            guardarEnStorage('mia_movimientos_v2', movimientos);
          }, [movimientos]);

          useEffect(() => {
            guardarEnStorage('mia_cxco_v3', cuentasPorCobrar);
          }, [cuentasPorCobrar]);

          useEffect(() => {
            guardarEnStorage('mia_cxpa_v3', cuentasPorPagar);
          }, [cuentasPorPagar]);

          // Formulario Movimiento General
          const [tipoMovimiento, setTipoMovimiento] = useState('Gasto');
          const [cuentaSeleccionada, setCuentaSeleccionada] = useState(cuentas[0]?.id || '1');
          const [categoriaSeleccionada, setCategoriaSeleccionada] = useState(CATEGORIAS_GASTO[0]);
          const [concepto, setConcepto] = useState('');
          const [valor, setValor] = useState('');
          const [fechaMovimiento, setFechaMovimiento] = useState(fechaHoy());

          // Formularios CxC y CxP (con Saldo Inicial y Fecha de Vencimiento)
          const [terceroCxC, setTerceroCxC] = useState('');
          const [conceptoCxC, setConceptoCxC] = useState('');
          const [saldoInicialCxC, setSaldoInicialCxC] = useState('');
          const [vencimientoCxC, setVencimientoCxC] = useState(fechaHoy());
          const [cuentaCxC, setCuentaCxC] = useState(cuentas[0]?.id || '1');
          const [obsCxC, setObsCxC] = useState('');

          const [terceroCxP, setTerceroCxP] = useState('');
          const [conceptoCxP, setConceptoCxP] = useState('');
          const [saldoInicialCxP, setSaldoInicialCxP] = useState('');
          const [vencimientoCxP, setVencimientoCxP] = useState(fechaHoy());
          const [cuentaCxP, setCuentaCxP] = useState(cuentas[0]?.id || '1');
          const [obsCxP, setObsCxP] = useState('');

          // Estados para pagos parciales/totales desde el Inicio
          const [pagoIdCxC, setPagoIdCxC] = useState('');
          const [montoPagoCxC, setMontoPagoCxC] = useState('');
          const [cuentaPagoCxC, setCuentaPagoCxC] = useState(cuentas[0]?.id || '1');

          const [pagoIdCxP, setPagoIdCxP] = useState('');
          const [montoPagoCxP, setMontoPagoCxP] = useState('');
          const [cuentaPagoCxP, setCuentaPagoCxP] = useState(cuentas[0]?.id || '1');

          const [modalNuevaCuenta, setModalNuevaCuenta] = useState(false);
          const [nuevoNombre, setNuevoNombre] = useState('');
          const [nuevoTipo, setNuevoTipo] = useState('Banco');
          const [nuevoSaldoInit, setNuevoSaldoInit] = useState('');

          const [modalEditarSaldo, setModalEditarSaldo] = useState(false);
          const [cuentaAEditar, setCuentaAEditar] = useState(null);
          const [saldoEditadoValor, setSaldoEditadoValor] = useState('');

          const [fechaDesde, setFechaDesde] = useState(primerDiaMes());
          const [fechaHasta, setFechaHasta] = useState(fechaHoy());

          const obtenerSaldoCuenta = (cuentaId) => {
            const c = cuentas.find((item) => item.id === cuentaId);
            if (!c) return 0;
            const ing = movimientos
              .filter((m) => m.cuentaId === cuentaId && m.tipo === 'Ingreso')
              .reduce((acc, m) => acc + m.valor, 0);
            const gas = movimientos
              .filter((m) => m.cuentaId === cuentaId && m.tipo === 'Gasto')
              .reduce((acc, m) => acc + m.valor, 0);
            return c.saldoInicial + ing - gas;
          };

          const patrimonioTotal = cuentas.reduce((acc, c) => acc + obtenerSaldoCuenta(c.id), 0);

          const guardarMovimiento = () => {
            const num = parseInt(valor.replace(/\D/g, ''), 10);
            if (!concepto.trim() || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Escribe un concepto y un valor numérico válido en COP.');
              return;
            }

            const nuevo = {
              id: Date.now(),
              cuentaId: cuentaSeleccionada,
              categoria: categoriaSeleccionada,
              concepto: concepto.trim(),
              valor: num,
              tipo: tipoMovimiento,
              fecha: fechaMovimiento.trim() || fechaHoy(),
            };

            setMovimientos((prev) => [nuevo, ...prev]);
            setConcepto('');
            setValor('');
            notificar('¡Registrado!', `${tipoMovimiento} guardado con éxito.`);
          };

          const guardarCxC = () => {
            const num = parseInt(saldoInicialCxC.replace(/\D/g, ''), 10);
            if (!terceroCxC.trim() || !conceptoCxC.trim() || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Ingresa el tercero, concepto y un saldo inicial válido.');
              return;
            }
            const nuevaCxC = {
              id: Date.now(),
              tercero: terceroCxC.trim(),
              concepto: conceptoCxC.trim(),
              valorTotal: num,
              saldoPendiente: num,
              vencimiento: vencimientoCxC,
              cuentaId: cuentaCxC,
              observacion: obsCxC.trim(),
              estado: 'Pendiente'
            };
            setCuentasPorCobrar(prev => [nuevaCxC, ...prev]);
            setTerceroCxC('');
            setConceptoCxC('');
            setSaldoInicialCxC('');
            setObsCxC('');
            notificar('Cuenta por Cobrar', 'Tercero y plazo registrados correctamente.');
          };

          // Procesar Abono / Pago Parcial o Total de CxC desde Inicio
          const procesarCobroInicio = () => {
            const item = cuentasPorCobrar.find(c => c.id.toString() === pagoIdCxC);
            const abono = parseInt(montoPagoCxC.replace(/\D/g, ''), 10);

            if (!item || isNaN(abono) || abono <= 0) {
              notificar('Datos inválidos', 'Selecciona una cuenta por cobrar e ingresa un monto válido.');
              return;
            }
            if (abono > item.saldoPendiente) {
              notificar('Monto excedentario', 'El abono no puede ser mayor al saldo pendiente.');
              return;
            }

            // Registrar ingreso en la cuenta seleccionada
            const movimientoIngreso = {
              id: Date.now(),
              cuentaId: cuentaPagoCxC,
              categoria: 'Otros Ingresos',
              concepto: `Abono/Cobro a ${item.tercero} (${item.concepto})`,
              valor: abono,
              tipo: 'Ingreso',
              fecha: fechaHoy(),
            };
            setMovimientos(prev => [movimientoIngreso, ...prev]);

            // Actualizar saldo pendiente
            const nuevoSaldo = item.saldoPendiente - abono;
            const nuevoEstado = nuevoSaldo === 0 ? 'Pagado' : 'Parcial';

            setCuentasPorCobrar(prev => prev.map(c => c.id === item.id ? { ...c, saldoPendiente: nuevoSaldo, estado: nuevoEstado } : c));
            setPagoIdCxC('');
            setMontoPagoCxC('');
            notificar('¡Pago Recibido!', `Se registraron ${formatoCOP(abono)} con éxito.`);
          };

          const guardarCxP = () => {
            const num = parseInt(saldoInicialCxP.replace(/\D/g, ''), 10);
            if (!terceroCxP.trim() || !conceptoCxP.trim() || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Ingresa el tercero, concepto y un saldo inicial válido.');
              return;
            }
            const nuevaCxP = {
              id: Date.now(),
              tercero: terceroCxP.trim(),
              concepto: conceptoCxP.trim(),
              valorTotal: num,
              saldoPendiente: num,
              vencimiento: vencimientoCxP,
              cuentaId: cuentaCxP,
              observacion: obsCxP.trim(),
              estado: 'Pendiente'
            };
            setCuentasPorPagar(prev => [nuevaCxP, ...prev]);
            setTerceroCxP('');
            setConceptoCxP('');
            setSaldoInicialCxP('');
            setObsCxP('');
            notificar('Cuenta por Pagar', 'Tercero y plazo registrados correctamente.');
          };

          // Procesar Abono / Pago Parcial o Total de CxP desde Inicio
          const procesarPagoInicio = () => {
            const item = cuentasPorPagar.find(c => c.id.toString() === pagoIdCxP);
            const abono = parseInt(montoPagoCxP.replace(/\D/g, ''), 10);

            if (!item || isNaN(abono) || abono <= 0) {
              notificar('Datos inválidos', 'Selecciona una cuenta por pagar e ingresa un monto válido.');
              return;
            }
            if (abono > item.saldoPendiente) {
              notificar('Monto excedentario', 'El pago no puede ser mayor al saldo pendiente.');
              return;
            }

            // Registrar gasto en la cuenta seleccionada
            const movimientoGasto = {
              id: Date.now(),
              cuentaId: cuentaPagoCxP,
              categoria: 'Otros Gastos',
              concepto: `Abono/Pago a ${item.tercero} (${item.concepto})`,
              valor: abono,
              tipo: 'Gasto',
              fecha: fechaHoy(),
            };
            setMovimientos(prev => [movimientoGasto, ...prev]);

            // Actualizar saldo pendiente
            const nuevoSaldo = item.saldoPendiente - abono;
            const nuevoEstado = nuevoSaldo === 0 ? 'Pagado' : 'Parcial';

            setCuentasPorPagar(prev => prev.map(c => c.id === item.id ? { ...c, saldoPendiente: nuevoSaldo, estado: nuevoEstado } : c));
            setPagoIdCxP('');
            setMontoPagoCxP('');
            notificar('¡Pago Realizado!', `Se descontaron ${formatoCOP(abono)} con éxito.`);
          };

          const guardarNuevaCuenta = () => {
            const saldo = parseInt(nuevoSaldoInit.replace(/\D/g, ''), 10) || 0;
            if (!nuevoNombre.trim()) {
              notificar('Falta el nombre', 'Ingresa el nombre del banco o cuenta.');
              return;
            }

            const iconos = { Efectivo: '💵', Banco: '🏦', Billetera: '📱' };

            const nueva = {
              id: Date.now().toString(),
              nombre: nuevoNombre.trim(),
              tipo: nuevoTipo,
              saldoInicial: saldo,
              icono: iconos[nuevoTipo],
            };

            setCuentas((prev) => [...prev, nueva]);
            setNuevoNombre('');
            setNuevoSaldoInit('');
            setModalNuevaCuenta(false);
          };

          const actualizarSaldoInicial = () => {
            if (!cuentaAEditar) return;
            const nuevoMonto = parseInt(saldoEditadoValor.replace(/\D/g, ''), 10) || 0;

            setCuentas((prev) =>
              prev.map((c) => (c.id === cuentaAEditar.id ? { ...c, saldoInicial: nuevoMonto } : c))
            );
            setModalEditarSaldo(false);
            setCuentaAEditar(null);
            notificar('Saldo Actualizado', 'El saldo inicial ha sido modificado.');
          };

          const reiniciarTodo = () => {
            const confirmar = window.confirm('¿Deseas borrar todos tus movimientos y empezar en limpio?');
            if (confirmar) {
              setCuentas(CUENTAS_BASE);
              setMovimientos([]);
              setCuentasPorCobrar([]);
              setCuentasPorPagar([]);
              guardarEnStorage('mia_cuentas_v2', CUENTAS_BASE);
              guardarEnStorage('mia_movimientos_v2', []);
              guardarEnStorage('mia_cxco_v3', []);
              guardarEnStorage('mia_cxpa_v3', []);
              notificar('Reinicio completo', 'Tus datos se han reiniciado.');
            }
          };

          const movimientosReporte = movimientos.filter((m) => {
            if (!fechaDesde && !fechaHasta) return true;
            if (fechaDesde && m.fecha < fechaDesde) return false;
            if (fechaHasta && m.fecha > fechaHasta) return false;
            return true;
          });

          const totalGastosReporte = movimientosReporte
            .filter((m) => m.tipo === 'Gasto')
            .reduce((acc, m) => acc + m.valor, 0);

          const totalIngresosReporte = movimientosReporte
            .filter((m) => m.tipo === 'Ingreso')
            .reduce((acc, m) => acc + m.valor, 0);

          const rubrosAgrupados = movimientosReporte
            .filter((m) => m.tipo === 'Gasto')
            .reduce((acc, m) => {
              acc[m.categoria] = (acc[m.categoria] || 0) + m.valor;
              return acc;
            }, {});

          const listaRubros = Object.entries(rubrosAgrupados).sort((a, b) => b[1] - a[1]);

          return (
            <div className="flex flex-col h-full bg-[#F3F7F2] relative w-full">
              {/* Header */}
              <div className="p-4 pb-2 text-center">
                <h1 className="text-3xl font-extrabold text-[#1B4332]">MIA</h1>
                <p className="text-xs font-semibold text-[#40916C]">Mi Inteligencia de Ahorro</p>
              </div>

              {/* Contenido scrolleable */}
              <div className="flex-1 overflow-y-auto p-4 pb-24">
                {/* --- INICIO --- */}
                {tab === 'inicio' && (
                  <div>
                    <div className="bg-[#1B4332] rounded-2xl p-5 mb-4 shadow-md text-white">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-[11px] font-bold text-[#B7E4C7] tracking-wider">PATRIMONIO TOTAL DISPONIBLE</span>
                        <button onClick={() => setTab('cuentas')} className="text-[#B7E4C7] text-xs font-bold hover:underline">⚙️ Ajustar saldos</button>
                      </div>
                      <h2 className="text-3xl font-extrabold my-2">{formatoCOP(patrimonioTotal)}</h2>
                      <p className="text-[11px] text-[#D8F3DC]">Suma consolidada de saldos iniciales + ingresos - gastos</p>
                    </div>

                    <div className="flex justify-between items-center mb-2">
                      <h3 className="text-[17px] font-bold text-[#1B4332]">Tus Fondos</h3>
                      <button onClick={() => setTab('cuentas')} className="text-xs text-[#2D6A4F] font-bold hover:underline">Ver saldos iniciales ›</button>
                    </div>

                    <div className="flex gap-2 overflow-x-auto mb-3 pb-1">
                      {cuentas.map((c) => (
                        <div key={c.id} className="bg-white p-3 rounded-2xl min-w-[125px] shadow-sm border border-slate-100">
                          <span className="text-2xl">{c.icono}</span>
                          <p className="text-xs font-semibold text-slate-700 mt-1 truncate">{c.nombre}</p>
                          <p className="text-[13px] font-bold text-[#205B43] mt-0.5">{formatoCOP(obtenerSaldoCuenta(c.id))}</p>
                        </div>
                      ))}
                    </div>

                    {/* SECCIÓN PAGOS Y COBROS RÁPIDOS DESDE INICIO (CxP / CxC) */}
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 my-4 space-y-4">
                      <h3 className="text-sm font-bold text-[#1B4332]">⚡ Gestión Rápida de CxP / CxC (Pagos y Cobros)</h3>
                      
                      {/* Recibir Cobro CxC */}
                      <div className="bg-[#F8FAF8] p-3 rounded-xl border border-[#DCE5DB]">
                        <label className="text-[11px] font-bold text-[#2D6A4F] block mb-1">📥 Registrar Cobro / Abono (CxC)</label>
                        <select value={pagoIdCxC} onChange={(e) => setPagoIdCxC(e.target.value)} className="w-full bg-white rounded-lg p-2 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none mb-2">
                          <option value="">-- Seleccionar Cuenta por Cobrar Pendiente --</option>
                          {cuentasPorCobrar.filter(c => c.estado !== 'Pagado').map(c => (
                            <option key={c.id} value={c.id}>{c.tercero} - {c.concepto} (Pendiente: {formatoCOP(c.saldoPendiente)})</option>
                          ))}
                        </select>
                        <div className="flex gap-2 mb-2">
                          <input type="number" placeholder="Monto a abonar" value={montoPagoCxC} onChange={(e) => setMontoPagoCxC(e.target.value)} className="flex-1 bg-white rounded-lg p-2 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none" />
                          <select value={cuentaPagoCxC} onChange={(e) => setCuentaPagoCxC(e.target.value)} className="flex-1 bg-white rounded-lg p-2 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none">
                            {cuentas.map(c => <option key={c.id} value={c.id}>{c.icono} {c.nombre}</option>)}
                          </select>
                        </div>
                        <button onClick={procesarCobroInicio} className="w-full bg-[#2D6A4F] text-white font-bold py-2 rounded-lg text-xs hover:bg-[#205B43] transition">Recibir Pago en Cuenta</button>
                      </div>

                      {/* Realizar Pago CxP */}
                      <div className="bg-[#F8FAF8] p-3 rounded-xl border border-[#DCE5DB]">
                        <label className="text-[11px] font-bold text-[#C94A4A] block mb-1">📤 Registrar Pago / Abono Deuda (CxP)</label>
                        <select value={pagoIdCxP} onChange={(e) => setPagoIdCxP(e.target.value)} className="w-full bg-white rounded-lg p-2 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none mb-2">
                          <option value="">-- Seleccionar Cuenta por Pagar Pendiente --</option>
                          {cuentasPorPagar.filter(c => c.estado !== 'Pagado').map(c => (
                            <option key={c.id} value={c.id}>{c.tercero} - {c.concepto} (Pendiente: {formatoCOP(c.saldoPendiente)})</option>
                          ))}
                        </select>
                        <div className="flex gap-2 mb-2">
                          <input type="number" placeholder="Monto a abonar" value={montoPagoCxP} onChange={(e) => setMontoPagoCxP(e.target.value)} className="flex-1 bg-white rounded-lg p-2 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none" />
                          <select value={cuentaPagoCxP} onChange={(e) => setCuentaPagoCxP(e.target.value)} className="flex-1 bg-white rounded-lg p-2 border border-[#DCE5DB] text-xs text-[#1F2937] outline-none">
                            {cuentas.map(c => <option key={c.id} value={c.id}>{c.icono} {c.nombre}</option>)}
                          </select>
                        </div>
                        <button onClick={procesarPagoInicio} className="w-full bg-[#C94A4A] text-white font-bold py-2 rounded-lg text-xs hover:bg-red-700 transition">Pagar Deuda desde Cuenta</button>
                      </div>
                    </div>

                    <h3 className="text-[17px] font-bold text-[#1B4332] mt-4 mb-2">Registrar Movimiento General</h3>
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                      <div className="flex gap-2">
                        <button
                          onClick={() => { setTipoMovimiento('Gasto'); setCategoriaSeleccionada(CATEGORIAS_GASTO[0]); }}
                          className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition ${tipoMovimiento === 'Gasto' ? 'bg-[#C94A4A] text-white shadow-md' : 'bg-[#E8EFE9] text-slate-700'}`}
                        >
                          Gasto
                        </button>
                        <button
                          onClick={() => { setTipoMovimiento('Ingreso'); setCategoriaSeleccionada(CATEGORIAS_INGRESO[0]); }}
                          className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition ${tipoMovimiento === 'Ingreso' ? 'bg-[#2D6A4F] text-white shadow-md' : 'bg-[#E8EFE9] text-slate-700'}`}
                        >
                          Ingreso
                        </button>
                      </div>

                      <div>
                        <label className="text-xs font-semibold text-[#52725F] block mb-1">¿En qué cuenta se mueve el dinero?</label>
                        <div className="flex gap-2 overflow-x-auto pb-1">
                          {cuentas.map((c) => (
                            <button
                              key={c.id}
                              onClick={() => setCuentaSeleccionada(c.id)}

                      {['Banco', 'Billetera', 'Efectivo'].map((t) => (
                        <button key={t} onClick={() => setNuevoTipo(t)} className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${nuevoTipo === t ? 'bg-[#205B43] text-white shadow' : 'bg-[#E8EFE9] text-[#205B43]'}`}>
                          {t}
                        </button>
                      ))}
                    </div>

                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Saldo inicial en COP:</label>
                    <input type="number" placeholder="Monto en pesos" value={nuevoSaldoInit} onChange={(e) => setNuevoSaldoInit(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none mb-3" />

                    <div className="flex gap-2">
                      <button onClick={() => setModalNuevaCuenta(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-sm hover:bg-slate-500 transition">Cancelar</button>
                      <button onClick={guardarNuevaCuenta} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-sm hover:bg-[#1B4332] transition">Crear Cuenta</button>
                    </div>
                  </div>
                </div>
              )}

              {/* --- NAVEGACIÓN INFERIOR (4 PESTAÑAS) --- */}
              <div className="absolute bottom-0 left-0 right-0 h-16 bg-white flex border-t border-[#E2E8F0] shadow-lg z-40">
                <button onClick={() => setTab('inicio')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'inicio' ? 'opacity-100 scale-110' : 'opacity-40'}`}>🏠</span>
                  <span className={`text-[10px] ${tab === 'inicio' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>Inicio</span>
                </button>
                <button onClick={() => setTab('cuentas')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'cuentas' ? 'opacity-100 scale-110' : 'opacity-40'}`}>🏦</span>
                  <span className={`text-[10px] ${tab === 'cuentas' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>Cuentas</span>
                </button>
                <button onClick={() => setTab('deudas')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'deudas' ? 'opacity-100 scale-110' : 'opacity-40'}`}>📑</span>
                  <span className={`text-[10px] ${tab === 'deudas' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>CxC / CxP</span>
                </button>
                <button onClick={() => setTab('reportes')} className="flex-1 flex flex-col items-center justify-center">
                  <span className={`text-lg transition ${tab === 'reportes' ? 'opacity-100 scale-110' : 'opacity-40'}`}>📊</span>
                  <span className={`text-[10px] ${tab === 'reportes' ? 'text-[#205B43] font-extrabold' : 'text-[#718078] font-semibold'}`}>Reportes</span>
                </button>
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
