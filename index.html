    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>

<body class="bg-[#112A20] text-slate-800 flex justify-center items-center min-h-screen m-0">
    <div id="root" class="w-full max-w-md h-screen md:h-[850px] bg-[#F3F7F2] shadow-2xl flex flex-col relative overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SUPABASE_URL = "https://qqcaufwuxfchsqrewhed.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxY2F1Znd1eGZjaHNxcmV3aGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTQyNjksImV4cCI6MjEwODY5MDI2OX0.yDoOkXdDCR_9nZn5RAQ2SNFmdmYs1-_R0WFyyvKsiZs";

        const T = {
          Español: {
            patrimonio: "PATRIMONIO TOTAL DISPONIBLE",
            ajustarSaldos: "⚙️ Ajustar saldos",
            subPatrimonio: "Suma consolidada de saldos iniciales + ingresos - gastos",
            fondosActivos: "Tus Fondos y Deudas Activas",
            verCuentas: "Ver cuentas ›",
            sinCuentas: "No hay cuentas ni deudas con saldo activo en este momento.",
            registrarMov: "Registrar Movimiento General",
            gasto: "Gasto",
            ingreso: "Ingreso",
            medioPago: "¿Qué medio de pago vas a utilizar?",
            fecha: "Fecha (AAAA-MM-DD):",
            rubro: "Rubro o Categoría:",
            conceptoPlaceholder: "Concepto (ej. Almuerzo, Mercado, Nómina)",
            valorPlaceholder: (moneda) => `Valor en ${moneda} (ej. 45.000)`,
            guardarMovBtn: "+ Guardar Movimiento",
            movRecientes: "Movimientos Recientes",
            sinMovs: "Aún no has registrado movimientos. ¡Agrega tu primero arriba!",
            cuentasTitulo: "Cuentas y Saldos Iniciales",
            crearCuentaBtn: "+ Crear Cuenta",
            cuentasSub: "Define el dinero con el que arrancas en cada cuenta. Consulta sus reportes y exporta su historial abajo.",
            saldoActual: "Saldo Actual:",
            saldoInicialLabel: "SALDO INICIAL:",
            modificarBtn: "✏️ Modificar",
            verReporteCuentaBtn: "📊 Ver Reporte y Exportar Movimientos",
            ocultarReporteCuentaBtn: "🔼 Ocultar Reporte de Cuenta",
            reiniciarCelularBtn: "🗑️ Reiniciar datos de este celular",
            deudasTitulo: "Gestión de Terceros (CxC / CxP)",
            fechaRegistro: "📅 Fecha del Registro:",
            tipoOp: "Tipo:",
            cxcOption: "📥 Cuentas por Cobrar (CxC)",
            cxpOption: "📤 Cuentas por Pagar (CxP)",
            terceroClientePlaceholder: "Tercero (Cliente / Deudor)",
            terceroProveedorPlaceholder: "Tercero (Proveedor / Acreedor)",
            conceptoDeuda: "Concepto / Rubro:",
            nuevoBtn: "+ Nuevo",
            cancelar: "Cancelar",
            vencimiento: "Fecha Vencimiento:",
            cuentaAfectadaCobrar: "Cuenta afectada al cobrar:",
            cuentaAfectadaPagar: "Cuenta afectada al pagar:",
            obsPlaceholder: "Observación / Nota",
            guardarCxCBtn: "Guardar Cuenta por Cobrar",
            guardarCxPBtn: "Guardar Cuenta por Pagar",
            registrarAbonoPago: "⚡ Registrar Abono o Pago",
            fechaAbono: "Fecha del Abono:",
            seleccionarTerceroCliente: "Seleccionar Tercero Pendiente (Cliente):",
            seleccionarTerceroProveedor: "Seleccionar Tercero Pendiente (Acreedor/Proveedor):",
            montoAbonarPlaceholder: "Monto a abonar",
            recibirPagoBtn: "Recibir Pago en Cuenta",
            pagarDeudaBtn: "Pagar Deuda desde Cuenta",
            reportesTitulo: "Reportes y Estado de Deudas",
            reporteDetallado: "📑 Reporte Detallado por Tercero (CxC / CxP)",
            balanceDeudas: "📊 Balance General de Deudas",
            reporteFechas: "Reporte Financiero por Fechas",
            gastosPeriodo: "GASTOS DEL PERÍODO",
            distribucionRubro: "Distribución por Rubro",
            adminPanel: "⚙️ Panel de Superusuario (ALGC)",
            cargaLogo: "Carga de Logotipo Institucional Global:",
            salir: "Salir",
            superusuario: "⚙️ Superusuario",
            inicioNav: "Inicio",
            cuentasNav: "Cuentas",
            deudasNav: "CxC / CxP",
            reportesNav: "Reportes",
            adminNav: "Admin"
          }
        };

        const fechaHoy = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const dia = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${dia}`;
        };

        const CUENTAS_BASE = [
          { id: '1', nombre: 'Efectivo en Mano', tipo: 'Efectivo', saldoInicial: 0, fechaSaldoInicial: fechaHoy(), icono: '💵' },
          { id: '2', nombre: 'Bancolombia', tipo: 'Banco', saldoInicial: 0, fechaSaldoInicial: fechaHoy(), icono: '🏦' },
          { id: '3', nombre: 'Nequi', tipo: 'Billetera', saldoInicial: 0, fechaSaldoInicial: fechaHoy(), icono: '📱' },
        ];

        const CATEGORIAS_GASTO_BASE = [
          'Alimentación', 'Transporte', 'Servicios / Hogar', 'Ocio / Salidas', 'Salud', 'Educación', 'Otros Gastos'
        ];

        const CATEGORIAS_INGRESO_BASE = [
          'Salario / Nómina', 'Ventas / Negocio', 'Otros Ingresos'
        ];

        const formatoCOP = (valor, monedaSimbolo = '$') => {
          if (isNaN(valor) || valor === null || valor === undefined) return `${monedaSimbolo} 0`;
          const signo = valor < 0 ? '-' : '';
          const valorAbs = Math.abs(Math.round(valor));
          const partes = valorAbs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          return `${signo}${monedaSimbolo} ${partes}`;
        };

        const formatearInputEnVivo = (inputStr) => {
          if (!inputStr) return '';
          const limpio = inputStr.toString().replace(/\D/g, '');
          if (!limpio) return '';
          return Number(limpio).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        };

        const obtenerNumeroLimpio = (inputStr) => {
          if (!inputStr) return 0;
          return parseInt(inputStr.toString().replace(/\D/g, ''), 10) || 0;
        };

        const notificar = (titulo, mensaje) => {
          if (typeof window !== 'undefined') {
            window.alert(`${titulo}\n\n${mensaje}`);
          }
        };

        const supabaseApi = {
          async signIn(email, password) {
            try {
              const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
                body: JSON.stringify({ email, password })
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error_description || data.msg || 'Credenciales inválidas');
              return { data, error: null };
            } catch (err) {
              return { data: null, error: err };
            }
          },
          async cargarDatosNube(token, userId) {
            try {
              const res = await fetch(`${SUPABASE_URL}/rest/v1/mia_datos_usuario?user_id=eq.${userId}&select=data`, {
                method: 'GET',
                headers: {
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${token}`
                }
              });
              if (!res.ok) return null;
              const rows = await res.json();
              if (rows && rows.length > 0) {
                let rawData = rows[0].data;
                let cuentasExtraidas = rawData?.cuentas || CUENTAS_BASE;
                cuentasExtraidas = cuentasExtraidas.map(c => ({
                  ...c,
                  saldoInicial: Number(c.saldoInicial !== undefined ? c.saldoInicial : (c.saldoinicial !== undefined ? c.saldoinicial : 0)),
                  fechaSaldoInicial: c.fechaSaldoInicial || fechaHoy()
                }));

                return {
                  cuentas: cuentasExtraidas,
                  movimientos: rawData?.movimientos || [],
                  cuentasPorCobrar: rawData?.cuentasPorCobrar || [],
                  cuentasPorPagar: rawData?.cuentasPorPagar || [],
                  moneda: rawData?.moneda || 'COP ($)',
                  idioma: rawData?.idioma || 'Español'
                };
              }
              return null;
            } catch (err) {
              console.error("Error cargando de la nube:", err);
              return null;
            }
          },
          async guardarDatosNube(token, userId, payload) {
            try {
              await fetch(`${SUPABASE_URL}/rest/v1/mia_datos_usuario?user_id=eq.${userId}`, {
                method: 'PATCH',
                headers: {
                  'Content-Type': 'application/json',
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${token}`,
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                  correo: payload.correo,
                  data: payload.data
                })
              });
            } catch (err) {
              console.error("Error guardando en la nube:", err);
            }
          },
          async cargarLogoGlobal() {
            try {
              const res = await fetch(`${SUPABASE_URL}/rest/v1/mia_configuracion?select=valor&clave=eq.logo_global`, {
                method: 'GET',
                headers: { 'apikey': SUPABASE_ANON_KEY }
              });
              if (!res.ok) return null;
              const rows = await res.json();
              if (rows && rows.length > 0) return rows[0].valor;
            } catch (err) {
              console.error("Error cargando logo global:", err);
            }
            return null;
          }
        };

        const LogoOficialMIA = ({ logoCustom }) => (
          <div className="flex items-center justify-center overflow-hidden rounded-2xl shadow-xl bg-[#112A20] border border-[#D4AF37]/30 w-36 h-36">
            {logoCustom ? <img src={logoCustom} alt="Logo" className="w-full h-full object-contain" /> : <span className="text-[#D4AF37] font-bold text-xl">MIA</span>}
          </div>
        );

        const LogoHeaderMIA = ({ logoCustom }) => (
          <div className="flex items-center">
            {logoCustom ? <img src={logoCustom} alt="Logo" className="w-9 h-9 mr-2 rounded-lg object-contain border border-[#D4AF37]/30" /> : null}
            <span style={{ fontFamily: 'Georgia, serif', fontWeight: 'bold', fontSize: '20px', letterSpacing: '4px', color: '#D4AF37' }}>MIA</span>
          </div>
        );

        function App() {
          const [sesion, setSesion] = useState(() => {
            const saved = localStorage.getItem('mia_sesion');
            return saved ? JSON.parse(saved) : null;
          });
          const [emailInput, setEmailInput] = useState('');
          const [passInput, setPassInput] = useState('');
          const [idiomaSeleccionado, setIdiomaSeleccionado] = useState('Español');
          const [monedaSeleccionada, setMonedaSeleccionada] = useState('COP ($)');
          const [tab, setTab] = useState('inicio');
          const [logoGlobal, setLogoGlobal] = useState(null);

          const [cuentas, setCuentas] = useState(CUENTAS_BASE);
          const [movimientos, setMovimientos] = useState([]);
          const [cuentasPorCobrar, setCuentasPorCobrar] = useState([]);
          const [cuentasPorPagar, setCuentasPorPagar] = useState([]);

          const [datosCargados, setDatosCargados] = useState(false);
          const datosCargadosRef = useRef(false);

          const t = T[idiomaSeleccionado] || T['Español'];

          useEffect(() => {
            supabaseApi.cargarLogoGlobal().then(logo => { if (logo) setLogoGlobal(logo); });
          }, []);

          useEffect(() => {
            if (sesion && sesion.access_token && !datosCargadosRef.current) {
              supabaseApi.cargarDatosNube(sesion.access_token, sesion.user_id).then((cloudData) => {
                if (cloudData && cloudData.cuentas) {
                  setCuentas(cloudData.cuentas);
                  setMovimientos(cloudData.movimientos || []);
                  setCuentasPorCobrar(cloudData.cuentasPorCobrar || []);
                  setCuentasPorPagar(cloudData.cuentasPorPagar || []);
                  if (cloudData.moneda) setMonedaSeleccionada(cloudData.moneda);
                  if (cloudData.idioma) setIdiomaSeleccionado(cloudData.idioma);
                }
                datosCargadosRef.current = true;
                setDatosCargados(true);
              });
            }
          }, [sesion]);

          useEffect(() => {
            if (sesion && sesion.access_token && datosCargados) {
              const payload = {
                correo: sesion.user?.email || emailInput,
                data: { cuentas, movimientos, cuentasPorCobrar, cuentasPorPagar, moneda: monedaSeleccionada, idioma: idiomaSeleccionado }
              };
              supabaseApi.guardarDatosNube(sesion.access_token, sesion.user_id, payload);
            }
          }, [cuentas, movimientos, cuentasPorCobrar, cuentasPorPagar, monedaSeleccionada, idiomaSeleccionado, datosCargados, sesion]);

          const manejarLogin = async () => {
            if (!emailInput || !passInput) {
              notificar('Datos incompletos', 'Ingresa tu correo y contraseña.');
              return;
            }
            const { data, error } = await supabaseApi.signIn(emailInput, passInput);
            if (error) {
              notificar('Error de Acceso', error.message);
            } else {
              const tokenValido = data.access_token || data.session?.access_token || data.token;
              const userIdValido = data.user?.id || data.session?.user?.id || data.id;
              const userSession = { user: { email: emailInput }, user_id: userIdValido, access_token: tokenValido };
              localStorage.clear();
              datosCargadosRef.current = false;
              setSesion(userSession);
              setDatosCargados(false);
              localStorage.setItem('mia_sesion', JSON.stringify(userSession));
            }
          };

          const cerrarSesion = () => {
            localStorage.clear();
            datosCargadosRef.current = false;
            setSesion(null);
            setDatosCargados(false);
            setCuentas(CUENTAS_BASE);
            setMovimientos([]);
          };

          const simboloMoneda = monedaSeleccionada.includes('USD') ? '$' : monedaSeleccionada.includes('EUR') ? '€' : '$';

          const [tipoMovimiento, setTipoMovimiento] = useState('Gasto');
          const [cuentaSeleccionada, setCuentaSeleccionada] = useState(cuentas[0]?.id || '1');
          const [categoriaSeleccionada, setCategoriaSeleccionada] = useState(CATEGORIAS_GASTO_BASE[0]);
          const [concepto, setConcepto] = useState('');
          const [valorDisplay, setValorDisplay] = useState('');
          const [fechaMovimiento, setFechaMovimiento] = useState(fechaHoy());

          const [modalEditarSaldo, setModalEditarSaldo] = useState(false);
          const [cuentaAEditar, setCuentaAEditar] = useState(null);
          const [saldoEditadoValorDisplay, setSaldoEditadoValorDisplay] = useState('');
          const [fechaSaldoEditado, setFechaSaldoEditado] = useState(fechaHoy());

          const obtenerSaldoCuenta = (cuentaId) => {
            const c = cuentas.find((item) => item.id === cuentaId);
            if (!c) return 0;
            const ing = movimientos.filter((m) => m.cuentaId === cuentaId && m.tipo === 'Ingreso').reduce((acc, m) => acc + m.valor, 0);
            const gas = movimientos.filter((m) => m.cuentaId === cuentaId && m.tipo === 'Gasto').reduce((acc, m) => acc + m.valor, 0);
            return (c.saldoInicial || 0) + ing - gas;
          };

          const patrimonioTotal = cuentas.reduce((acc, c) => acc + obtenerSaldoCuenta(c.id), 0);
          const cuentasConSaldo = cuentas.filter(c => obtenerSaldoCuenta(c.id) !== 0 || c.saldoInicial !== 0);

          const guardarMovimiento = () => {
            const num = obtenerNumeroLimpio(valorDisplay);
            if (!concepto.trim() || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Escribe un concepto y un valor numérico válido.');
              return;
            }
            const nuevo = {
              id: Date.now(),
              cuentaId: cuentaSeleccionada,
              categoria: categoriaSeleccionada,
              concepto: concepto.trim(),
              valor: num,
              tipo: tipoMovimiento,
              fecha: fechaMovimiento.trim() || fechaHoy(),
            };
            setMovimientos((prev) => [nuevo, ...prev]);
            setConcepto('');
            setValorDisplay('');
            notificar('¡Registrado!', `${tipoMovimiento} guardado con éxito.`);
          };

          const actualizarSaldoInicial = () => {
            if (!cuentaAEditar) return;
            const nuevoMonto = obtenerNumeroLimpio(saldoEditadoValorDisplay);
            setCuentas((prev) =>
              prev.map((c) => (c.id === cuentaAEditar.id ? { ...c, saldoInicial: nuevoMonto, fechaSaldoInicial: fechaSaldoEditado } : c))
            );
            setModalEditarSaldo(false);
            setCuentaAEditar(null);
            notificar('Saldo Actualizado', 'El saldo inicial y su fecha han sido modificados.');
          };

          if (!sesion) {
            return (
              <div className="flex flex-col h-full bg-[#112A20] justify-center items-center p-3 w-full text-white overflow-y-auto">
                <LogoOficialMIA logoCustom={logoGlobal} />
                <div className="bg-white text-slate-800 rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-3 shrink-0 mt-3">
                  <h2 className="text-lg font-bold text-center text-[#112A20]">Iniciar Sesión</h2>
                  <div>
                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Correo electrónico:</label>
                    <input type="email" placeholder="tucorreo@email.com" value={emailInput} onChange={(e) => setEmailInput(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm outline-none" />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-[#52725F] block mb-1">Contraseña:</label>
                    <input type="password" placeholder="••••••••" value={passInput} onChange={(e) => setPassInput(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm outline-none" />
                  </div>
                  <button onClick={manejarLogin} className="w-full bg-[#205B43] text-white font-bold py-3 rounded-xl shadow hover:bg-[#112A20] transition mt-2">Ingresar</button>
                </div>
              </div>
            );
          }

          return (
            <div className="flex flex-col h-full bg-[#F3F7F2] relative w-full">
              <div className="p-2 px-4 flex justify-between items-center bg-white border-b border-slate-100 shadow-sm">
                <LogoHeaderMIA logoCustom={logoGlobal} />
                <button onClick={cerrarSesion} className="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold border border-red-200 hover:bg-red-100 transition">Salir</button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 pb-24">
                {tab === 'inicio' && (
                  <div>
                    <div className="bg-[#112A20] rounded-2xl p-5 mb-4 shadow-md text-white">
                      <span className="text-[11px] font-bold text-[#B7E4C7] tracking-wider">{t.patrimonio} ({monedaSeleccionada})</span>
                      <h2 className="text-3xl font-extrabold my-2">{formatoCOP(patrimonioTotal, simboloMoneda)}</h2>
                      <p className="text-[11px] text-[#D8F3DC]">{t.subPatrimonio}</p>
                    </div>

                    <h3 className="text-[17px] font-bold text-[#112A20] mt-4 mb-2">{t.registrarMov}</h3>
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
                      <div className="flex gap-2">
                        <button onClick={() => setTipoMovimiento('Gasto')} className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition ${tipoMovimiento === 'Gasto' ? 'bg-[#C94A4A] text-white' : 'bg-[#E8EFE9] text-slate-700'}`}>{t.gasto}</button>
                        <button onClick={() => setTipoMovimiento('Ingreso')} className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition ${tipoMovimiento === 'Ingreso' ? 'bg-[#2D6A4F] text-white' : 'bg-[#E8EFE9] text-slate-700'}`}>{t.ingreso}</button>
                      </div>

                      <select value={cuentaSeleccionada} onChange={(e) => setCuentaSeleccionada(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none">
                        {cuentas.map((c) => (<option key={c.id} value={c.id}>{c.icono} {c.nombre}</option>))}
                      </select>

                      <input type="text" placeholder={t.conceptoPlaceholder} value={concepto} onChange={(e) => setConcepto(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none" />
                      <input type="text" placeholder={t.valorPlaceholder(monedaSeleccionada)} value={valorDisplay} onChange={(e) => setValorDisplay(formatearInputEnVivo(e.target.value))} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none" />
                      <button onClick={guardarMovimiento} className="w-full bg-[#205B43] text-white font-bold py-3.5 rounded-xl shadow-md mt-2">{t.guardarMovBtn}</button>
                    </div>
                  </div>
                )}

                {tab === 'cuentas' && (
                  <div>
                    <h3 className="text-[17px] font-bold text-[#112A20] mb-3">{t.cuentasTitulo}</h3>
                    {cuentas.map((c) => (
                      <div key={c.id} className="bg-white rounded-2xl p-4 my-3 shadow-sm border border-slate-100 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xl">{c.icono} <strong className="text-base text-slate-800">{c.nombre}</strong></span>
                          <span className="text-base font-bold text-[#205B43]">{formatoCOP(obtenerSaldoCuenta(c.id), simboloMoneda)}</span>
                        </div>
                        <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                          <span className="text-xs text-slate-500">{t.saldoInicialLabel} (Fecha: {c.fechaSaldoInicial || fechaHoy()}): <strong>{formatoCOP(c.saldoInicial, simboloMoneda)}</strong></span>
                          <button onClick={() => { setCuentaAEditar(c); setSaldoEditadoValorDisplay(formatearInputEnVivo(c.saldoInicial)); setFechaSaldoEditado(c.fechaSaldoInicial || fechaHoy()); setModalEditarSaldo(true); }} className="bg-[#E8EFE9] px-3 py-1.5 rounded-xl text-xs font-bold text-[#205B43]">{t.modificarBtn}</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* MODAL EDITAR SALDO INICIAL Y FECHA */}
              {modalEditarSaldo && (
                <div className="absolute inset-0 bg-black/50 flex justify-center items-center p-5 z-50">
                  <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl space-y-3">
                    <h3 className="text-lg font-extrabold text-[#112A20] text-center mb-1">Modificar Saldo Inicial</h3>
                    <p className="text-xs text-[#52725F] mb-2 text-center">Cuenta: <span className="font-bold">{cuentaAEditar?.nombre}</span></p>

                    <div>
                      <label className="text-xs font-semibold text-[#52725F] block mb-1">📅 Fecha de corte del saldo inicial:</label>
                      <input type="date" value={fechaSaldoEditado} onChange={(e) => setFechaSaldoEditado(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none font-semibold mb-2" />
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-[#52725F] block mb-1">Nuevo saldo de arranque:</label>
                      <input type="text" value={saldoEditadoValorDisplay} onChange={(e) => setSaldoEditadoValorDisplay(formatearInputEnVivo(e.target.value))} className="w-full bg-[#F8FAF8] rounded-xl p-3 border border-[#DCE5DB] text-sm text-[#1F2937] outline-none mb-3 font-bold" />
                    </div>

                    <div className="flex gap-2">
                      <button onClick={() => setModalEditarSaldo(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-xs">Cancelar</button>
                      <button onClick={actualizarSaldoInicial} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-xs">Guardar Saldo</button>
                    </div>
                  </div>
                </div>
              )}

              <div className="absolute bottom-0 left-0 right-0 h-16 bg-white flex border-t border-[#E2E8F0] shadow-lg z-40">
                <button onClick={() => setTab('inicio')} className="flex-1 flex flex-col items-center justify-center text-xs font-bold text-[#205B43]">🏠 Inicio</button>
                <button onClick={() => setTab('cuentas')} className="flex-1 flex flex-col items-center justify-center text-xs font-bold text-slate-500">🏦 Cuentas</button>
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
