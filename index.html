        const formatoCOP = (valor, monedaSimbolo = '$') => {
          if (isNaN(valor) || valor === null || valor === undefined) return `${monedaSimbolo} 0`;
          const signo = valor < 0 ? '-' : '';
          const valorAbs = Math.abs(Math.round(valor));
          const partes = valorAbs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          return `${signo}${monedaSimbolo} ${partes}`;
        };

                        <p className="text-xs font-bold text-[#205B43]">Registros encontrados: {listaDeudasReporte.length}</p>
                        <div className="flex gap-2">
                          <button onClick={exportarReporteCarteraCSV} className="flex-1 bg-[#205B43] text-white py-2 rounded-lg text-xs font-bold">📊 Exportar Excel</button>
                          <button onClick={exportarReporteCarteraPDF} className="flex-1 bg-[#40916C] text-white py-2 rounded-lg text-xs font-bold">📄 Exportar PDF</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {tab === 'admin' && esSuperAdmin && (
                  <div className="bg-white rounded-3xl p-5 shadow-lg border border-[#D4AF37]/30 space-y-4">
                    <h3 className="text-lg font-extrabold text-[#112A20] border-b pb-2">{t.adminPanel}</h3>
                    
                    <div className="space-y-3 bg-[#F8FAF8] p-4 rounded-2xl border">
                      <h4 className="text-xs font-bold text-[#112A20]">📊 Reporte Ejecutivo de Usuarios</h4>
                      
                      <div className="flex gap-2">
                        <div className="flex-1">
                          <label className="text-[10px] font-bold text-slate-600 block mb-0.5">Desde:</label>
                          <input type="date" value={filtroFechaDesde} onChange={(e) => setFiltroFechaDesde(e.target.value)} className="w-full bg-white rounded-lg p-1.5 border text-[11px]" />
                        </div>
                        <div className="flex-1">
                          <label className="text-[10px] font-bold text-slate-600 block mb-0.5">Hasta:</label>
                          <input type="date" value={filtroFechaHasta} onChange={(e) => setFiltroFechaHasta(e.target.value)} className="w-full bg-white rounded-lg p-1.5 border text-[11px]" />
                        </div>
                      </div>

                      <select value={tipoBusqueda} onChange={(e) => setTipoBusqueda(e.target.value)} className="w-full bg-white rounded-lg p-2 border text-xs">
                        <option value="correo">Buscar por Correo</option>
                        <option value="idioma">Buscar por Idioma</option>
                        <option value="moneda">Buscar por Moneda</option>
                      </select>
                      <button onClick={() => setReporteGenerado(true)} className="w-full bg-[#205B43] text-white font-bold py-2 rounded-xl text-xs">🔍 Mostrar Reporte por Fechas</button>
                    </div>

                    {reporteGenerado && (
                      <div className="space-y-3 pt-3 border-t">
                        <div className="bg-[#112A20] text-white p-3 rounded-xl">
                          <p className="text-[10px] text-[#B7E4C7] font-bold uppercase">Total Usuarios en el Rango</p>
                          <h3 className="text-2xl font-extrabold">{usuariosFiltrados.length}</h3>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={exportarReporteUsuariosCSV} className="flex-1 bg-[#205B43] text-white py-2 rounded-lg text-xs font-bold">📊 Excel (CSV)</button>
                          <button onClick={exportarReporteUsuariosPDF} className="flex-1 bg-[#40916C] text-white py-2 rounded-lg text-xs font-bold">📄 PDF</button>
                        </div>
                      </div>
                    )}

                    <div className="space-y-3 pt-2">
                      <h4 className="text-xs font-bold text-[#112A20]">{t.cargaLogo}</h4>
                      <div className="flex items-center gap-3 bg-[#F8FAF8] p-3 rounded-2xl border">
                        <div className="w-12 h-12 bg-[#112A20] rounded-xl flex items-center justify-center overflow-hidden border">
                          {logoGlobal ? <img src={logoGlobal} alt="Logo" className="w-full h-full object-contain" /> : <span className="text-xs text-[#D4AF37] font-bold">MIA</span>}
                        </div>
                        <input type="file" accept="image/*" onChange={manejarSubidaLogoGlobalLocal} className="w-full text-xs text-slate-500 cursor-pointer" />
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {modalEditarMovimiento && (
                <div className="absolute inset-0 bg-black/50 flex justify-center items-center p-5 z-50">
                  <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl space-y-3">
                    <h3 className="text-lg font-extrabold text-[#112A20] text-center">Editar Movimiento</h3>
                    <input type="text" value={editConcepto} onChange={(e) => setEditConcepto(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border text-sm" />
                    <input type="text" value={editValorDisplay} onChange={(e) => setEditValorDisplay(formatearInputEnVivo(e.target.value))} className="w-full bg-[#F8FAF8] rounded-xl p-3 border text-sm font-bold" />
                    <div className="flex gap-2">
                      <button onClick={() => setModalEditarMovimiento(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-xs">Cancelar</button>
                      <button onClick={guardarEdicionMovimiento} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-xs">Guardar</button>
                    </div>
                  </div>
                </div>
              )}

              {modalEditarSaldo && (
                <div className="absolute inset-0 bg-black/50 flex justify-center items-center p-5 z-50">
                  <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl space-y-3">
                    <h3 className="text-lg font-extrabold text-[#112A20] text-center">Modificar Saldo Inicial</h3>
                    <p className="text-xs text-[#52725F] text-center">Cuenta: <strong>{cuentaAEditar?.nombre}</strong></p>
                    <div>
                      <label className="text-xs font-semibold text-[#52725F] block mb-1">📅 Fecha de corte:</label>
                      <input type="date" value={fechaSaldoEditado} onChange={(e) => setFechaSaldoEditado(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border text-sm font-semibold mb-2" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-[#52725F] block mb-1">Nuevo saldo de arranque:</label>
                      <input type="text" value={saldoEditadoValorDisplay} onChange={(e) => setSaldoEditadoValorDisplay(formatearInputEnVivo(e.target.value))} className="w-full bg-[#F8FAF8] rounded-xl p-3 border text-sm font-bold mb-3" />
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => setModalEditarSaldo(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-xs">Cancelar</button>
                      <button onClick={actualizarSaldoInicial} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-xs">Guardar Saldo</button>
                    </div>
                  </div>
                </div>
              )}

              {modalNuevaCuenta && (
                <div className="absolute inset-0 bg-black/50 flex justify-center items-center p-5 z-50">
                  <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl space-y-3">
                    <h3 className="text-lg font-extrabold text-[#112A20] text-center">Nueva Cuenta</h3>
                    <input type="text" placeholder="Nombre" value={nuevoNombre} onChange={(e) => setNuevoNombre(e.target.value)} className="w-full bg-[#F8FAF8] rounded-xl p-3 border text-sm" />
                    <input type="text" placeholder="Saldo Inicial" value={nuevoSaldoInitDisplay} onChange={(e) => setNuevoSaldoInitDisplay(formatearInputEnVivo(e.target.value))} className="w-full bg-[#F8FAF8] rounded-xl p-3 border text-sm" />
                    <div className="flex gap-2">
                      <button onClick={() => setModalNuevaCuenta(false)} className="flex-1 bg-[#8F9F95] text-white font-bold py-3 rounded-xl text-xs">Cancelar</button>
                      <button onClick={guardarNuevaCuenta} className="flex-1 bg-[#205B43] text-white font-bold py-3 rounded-xl text-xs">Crear</button>
                    </div>
                  </div>
                </div>
              )}

              <div className="absolute bottom-0 left-0 right-0 h-16 bg-white flex border-t border-[#E2E8F0] shadow-lg z-40">
                <button onClick={() => setTab('inicio')} className="flex-1 flex flex-col items-center justify-center"><span className="text-lg">🏠</span><span className={`text-[10px] ${tab === 'inicio' ? 'text-[#205B43] font-extrabold' : 'text-slate-500'}`}>Inicio</span></button>
                <button onClick={() => setTab('cuentas')} className="flex-1 flex flex-col items-center justify-center"><span className="text-lg">🏦</span><span className={`text-[10px] ${tab === 'cuentas' ? 'text-[#205B43] font-extrabold' : 'text-slate-500'}`}>Cuentas</span></button>
                <button onClick={() => setTab('deudas')} className="flex-1 flex flex-col items-center justify-center"><span className="text-lg">📑</span><span className={`text-[10px] ${tab === 'deudas' ? 'text-[#205B43] font-extrabold' : 'text-slate-500'}`}>CxC / CxP</span></button>
                <button onClick={() => setTab('reportes')} className="flex-1 flex flex-col items-center justify-center"><span className="text-lg">📊</span><span className={`text-[10px] ${tab === 'reportes' ? 'text-[#205B43] font-extrabold' : 'text-slate-500'}`}>Reportes</span></button>
                {esSuperAdmin && (<button onClick={() => setTab('admin')} className="flex-1 flex flex-col items-center justify-center"><span className="text-lg">⚙️</span><span className={`text-[10px] ${tab === 'admin' ? 'text-amber-600 font-extrabold' : 'text-slate-500'}`}>Admin</span></button>)}
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
