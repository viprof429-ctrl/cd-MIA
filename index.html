<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA - Mi Inteligencia de Ahorro</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="bg-[#F3F7F2] text-slate-800 flex justify-center items-center min-h-screen m-0">
    <div id="root" class="w-full max-w-md h-screen md:h-[850px] bg-[#F3F7F2] shadow-2xl flex flex-col relative overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CUENTAS_BASE = [
          { id: '1', nombre: 'Efectivo en Mano', tipo: 'Efectivo', saldoInicial: 0, icono: '💵' },
          { id: '2', nombre: 'Bancolombia', tipo: 'Banco', saldoInicial: 0, icono: '🏦' },
          { id: '3', nombre: 'Nequi', tipo: 'Billetera', saldoInicial: 0, icono: '📱' },
        ];

        const CATEGORIAS_GASTO_BASE = [
          'Alimentación', 'Transporte', 'Servicios / Hogar', 'Ocio / Salidas', 'Salud', 'Educación', 'Otros Gastos'
        ];

        const CATEGORIAS_INGRESO_BASE = [
          'Salario / Nómina', 'Ventas / Negocio', 'Otros Ingresos'
        ];

        const guardarEnStorage = (subClave, valor) => {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              const dbActual = JSON.parse(window.localStorage.getItem('miahorro') || '{}');
              dbActual[subClave] = valor;
              window.localStorage.setItem('miahorro', JSON.stringify(dbActual));
            }
          } catch (e) {}
        };

        const cargarDeStorage = (subClave, valorPorDefecto) => {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              const dbActual = JSON.parse(window.localStorage.getItem('miahorro') || '{}');
              if (dbActual[subClave] !== undefined && dbActual[subClave] !== null) {
                return dbActual[subClave];
              }
            }
          } catch (e) {}
          return valorPorDefecto;
        };

        const formatoCOP = (valor) => {
          if (isNaN(valor) || valor === null || valor === undefined) return '$ 0';
          const signo = valor < 0 ? '-' : '';
          const valorAbs = Math.abs(Math.round(valor));
          const partes = valorAbs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          return `${signo}$ ${partes}`;
        };

        const formatearInputEnVivo = (inputStr) => {
          if (!inputStr) return '';
          const limpio = inputStr.toString().replace(/\D/g, '');
          if (!limpio) return '';
          return Number(limpio).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        };

        const obtenerNumeroLimpio = (inputStr) => {
          if (!inputStr) return 0;
          return parseInt(inputStr.toString().replace(/\D/g, ''), 10) || 0;
        };

        const fechaHoy = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const dia = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${dia}`;
        };

        const primerDiaMes = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          return `${y}-${m}-01`;
        };

        const notificar = (titulo, mensaje) => {
          if (typeof window !== 'undefined') {
            window.alert(`${titulo}\n\n${mensaje}`);
          }
        };

        function App() {
          const [tab, setTab] = useState('inicio');

          const [cuentas, setCuentas] = useState(() =>
            cargarDeStorage('cuentas', CUENTAS_BASE)
          );

          const [movimientos, setMovimientos] = useState(() =>
            cargarDeStorage('movimientos', [])
          );

          const [cuentasPorCobrar, setCuentasPorCobrar] = useState(() =>
            cargarDeStorage('cxco', [])
          );

          const [cuentasPorPagar, setCuentasPorPagar] = useState(() =>
            cargarDeStorage('cxpa', [])
          );

          const [categoriasGasto, setCategoriasGasto] = useState(() =>
            cargarDeStorage('cat_gasto', CATEGORIAS_GASTO_BASE)
          );
          const [categoriasIngreso, setCategoriasIngreso] = useState(() =>
            cargarDeStorage('cat_ingreso', CATEGORIAS_INGRESO_BASE)
          );
          const [conceptosDeuda, setConceptosDeuda] = useState(() =>
            cargarDeStorage('conceptos_deuda', [...CATEGORIAS_GASTO_BASE, ...CATEGORIAS_INGRESO_BASE, 'Préstamo Personal', 'Inversión'])
          );

          useEffect(() => { guardarEnStorage('cuentas', cuentas); }, [cuentas]);
          useEffect(() => { guardarEnStorage('movimientos', movimientos); }, [movimientos]);
          useEffect(() => { guardarEnStorage('cxco', cuentasPorCobrar); }, [cuentasPorCobrar]);
          useEffect(() => { guardarEnStorage('cxpa', cuentasPorPagar); }, [cuentasPorPagar]);
          useEffect(() => { guardarEnStorage('cat_gasto', categoriasGasto); }, [categoriasGasto]);
          useEffect(() => { guardarEnStorage('cat_ingreso', categoriasIngreso); }, [categoriasIngreso]);
          useEffect(() => { guardarEnStorage('conceptos_deuda', conceptosDeuda); }, [conceptosDeuda]);

          useEffect(() => {
            const ahora = new Date();
            const hora = ahora.getHours();
            const hoyStr = fechaHoy();
            const ultimoCheck = window.localStorage.getItem('mia_ultimo_check') || '';

            if (ultimoCheck !== hoyStr) {
              if (hora >= 10 && hora < 12) {
                notificar('MIA - Recordatorio ⏰', '¡Oye, hoy no me has mirado! 👀 Pásate a registrar tus movimientos de la mañana.');
                window.localStorage.setItem('mia_ultimo_check', hoyStr);
              } else if (hora >= 17) {
                notificar('MIA - Recordatorio ⏰', '¡Oye, hoy no me has mirado! 👀 ¿Cómo van los gastos de la tarde? Regístralos.');
                window.localStorage.setItem('mia_ultimo_check', hoyStr);
              }
            }

            const mananaObj = new Date();
            mananaObj.setDate(mananaObj.getDate() + 1);
            const mananaStr = `${mananaObj.getFullYear()}-${String(mananaObj.getMonth() + 1).padStart(2, '0')}-${String(mananaObj.getDate()).padStart(2, '0')}`;

            const porVencerCxC = cuentasPorCobrar.filter(c => c.estado !== 'Pagado' && c.vencimiento === mananaStr);
            const porVencerCxP = cuentasPorPagar.filter(c => c.estado !== 'Pagado' && c.vencimiento === mananaStr);

            if (porVencerCxC.length > 0 || porVencerCxP.length > 0) {
              notificar('⚠️ Alerta de Vencimiento', 'Tienes cuentas por cobrar o pagar que vencen MAÑANA. ¡Revisa tu módulo de deudas!');
            }
          }, []);

          const [tipoMovimiento, setTipoMovimiento] = useState('Gasto');
          const [cuentaSeleccionada, setCuentaSeleccionada] = useState(cuentas[0]?.id || '1');
          const [categoriaSeleccionada, setCategoriaSeleccionada] = useState(categoriasGasto[0]);
          const [concepto, setConcepto] = useState('');
          const [valorDisplay, setValorDisplay] = useState('');
          const [fechaMovimiento, setFechaMovimiento] = useState(fechaHoy());

          const [tipoCxUnified, setTipoCxUnified] = useState('CxC');
          const [fechaGeneralReg, setFechaGeneralReg] = useState(fechaHoy());

          const [terceroCxC, setTerceroCxC] = useState('');
          const [conceptoCxC, setConceptoCxC] = useState(conceptosDeuda[0]);
          const [nuevoConceptoCxC, setNuevoConceptoCxC] = useState('');
          const [usarNuevoConceptoCxC, setUsarNuevoConceptoCxC] = useState(false);

          const [saldoInicialCxCDisplay, setSaldoInicialCxCDisplay] = useState('');
          const [vencimientoCxC, setVencimientoCxC] = useState(fechaHoy());
          const [cuentaCxC, setCuentaCxC] = useState(cuentas[0]?.id || '1');
          const [obsCxC, setObsCxC] = useState('');

          const [terceroCxP, setTerceroCxP] = useState('');
          const [conceptoCxP, setConceptoCxP] = useState(conceptosDeuda[0]);
          const [nuevoConceptoCxP, setNuevoConceptoCxP] = useState('');
          const [usarNuevoConceptoCxP, setUsarNuevoConceptoCxP] = useState(false);

          const [saldoInicialCxPDisplay, setSaldoInicialCxPDisplay] = useState('');
          const [vencimientoCxP, setVencimientoCxP] = useState(fechaHoy());
          const [cuentaCxP, setCuentaCxP] = useState(cuentas[0]?.id || '1');
          const [obsCxP, setObsCxP] = useState('');

          const [tipoAbonoUnified, setTipoAbonoUnified] = useState('CxC');
          const [fechaAbonoUnified, setFechaAbonoUnified] = useState(fechaHoy());
          const [pagoIdCxC, setPagoIdCxC] = useState('');
          const [montoPagoCxCDisplay, setMontoPagoCxCDisplay] = useState('');
          const [cuentaPagoCxC, setCuentaPagoCxC] = useState(cuentas[0]?.id || '1');

          const [pagoIdCxP, setPagoIdCxP] = useState('');
          const [montoPagoCxPDisplay, setMontoPagoCxPDisplay] = useState('');
          const [cuentaPagoCxP, setCuentaPagoCxP] = useState(cuentas[0]?.id || '1');

          const [tipoReporteTercero, setTipoReporteTercero] = useState('CxC');
          const [terceroSeleccionadoId, setTerceroSeleccionadoId] = useState('');

          const [cuentaReporteId, setCuentaReporteId] = useState('');

          const [modalNuevaCuenta, setModalNuevaCuenta] = useState(false);
          const [nuevoNombre, setNuevoNombre] = useState('');
          const [nuevoTipo, setNuevoTipo] = useState('Banco');
          const [nuevoSaldoInitDisplay, setNuevoSaldoInitDisplay] = useState('');

          const [modalEditarSaldo, setModalEditarSaldo] = useState(false);
          const [cuentaAEditar, setCuentaAEditar] = useState(null);
          const [saldoEditadoValorDisplay, setSaldoEditadoValorDisplay] = useState('');

          const [fechaDesde, setFechaDesde] = useState(primerDiaMes());
          const [fechaHasta, setFechaHasta] = useState(fechaHoy());

          const obtenerSaldoCuenta = (cuentaId) => {
            const c = cuentas.find((item) => item.id === cuentaId);
            if (!c) return 0;
            const ing = movimientos
              .filter((m) => m.cuentaId === cuentaId && m.tipo === 'Ingreso')
              .reduce((acc, m) => acc + m.valor, 0);
            const gas = movimientos
              .filter((m) => m.cuentaId === cuentaId && m.tipo === 'Gasto')
              .reduce((acc, m) => acc + m.valor, 0);
            return c.saldoInicial + ing - gas;
          };

          const patrimonioTotal = cuentas.reduce((acc, c) => acc + obtenerSaldoCuenta(c.id), 0);
          const totalCxCPendiente = cuentasPorCobrar.reduce((acc, item) => acc + item.saldoPendiente, 0);
          const totalCxPPendiente = cuentasPorPagar.reduce((acc, item) => acc + item.saldoPendiente, 0);

          const guardarMovimiento = () => {
            const num = obtenerNumeroLimpio(valorDisplay);
            if (!concepto.trim() || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Escribe un concepto y un valor numérico válido en COP.');
              return;
            }

            const nuevo = {
              id: Date.now(),
              cuentaId: cuentaSeleccionada,
              categoria: categoriaSeleccionada,
              concepto: concepto.trim(),
              valor: num,
              tipo: tipoMovimiento,
              fecha: fechaMovimiento.trim() || fechaHoy(),
            };

            setMovimientos((prev) => [nuevo, ...prev]);
            setConcepto('');
            setValorDisplay('');
            notificar('¡Registrado!', `${tipoMovimiento} guardado con éxito.`);
          };

          const guardarCxC = () => {
            const num = obtenerNumeroLimpio(saldoInicialCxCDisplay);
            const conceptoFinal = usarNuevoConceptoCxC ? nuevoConceptoCxC.trim() : conceptoCxC;

            if (!terceroCxC.trim() || !conceptoFinal || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Ingresa el tercero, concepto y un saldo inicial válido.');
              return;
            }

            if (usarNuevoConceptoCxC && !conceptosDeuda.includes(conceptoFinal)) {
              setConceptosDeuda(prev => [...prev, conceptoFinal]);
            }

            const nuevaCxC = {
              id: Date.now(),
              tercero: terceroCxC.trim(),
              concepto: conceptoFinal,
              valorTotal: num,
              saldoPendiente: num,
              fechaInicial: fechaGeneralReg,
              vencimiento: vencimientoCxC,
              cuentaId: cuentaCxC,
              observacion: obsCxC.trim(),
              estado: 'Pendiente',
              historialPagos: []
            };
            setCuentasPorCobrar(prev => [nuevaCxC, ...prev]);
            setTerceroCxC('');
            setSaldoInicialCxCDisplay('');
            setObsCxC('');
            setUsarNuevoConceptoCxC(false);
            setNuevoConceptoCxC('');
            notificar('Cuenta por Cobrar', 'Tercero y plazos registrados correctamente.');
          };

          const procesarCobroUnificado = () => {
            const item = cuentasPorCobrar.find(c => c.id.toString() === pagoIdCxC);
            const abono = obtenerNumeroLimpio(montoPagoCxCDisplay);

            if (!item || isNaN(abono) || abono <= 0) {
              notificar('Datos inválidos', 'Selecciona una cuenta por cobrar e ingresa un monto válido.');
              return;
            }
            if (abono > item.saldoPendiente) {
              notificar('Monto excedentario', 'El abono no puede ser mayor al saldo pendiente.');
              return;
            }

            const cuentaAsoc = cuentas.find(c => c.id === cuentaPagoCxC);
            const movimientoIngreso = {
              id: Date.now(),
              cuentaId: cuentaPagoCxC,
              categoria: 'Otros Ingresos',
              concepto: `Abono de ${item.tercero} (${item.concepto})`,
              valor: abono,
              tipo: 'Ingreso',
              fecha: fechaAbonoUnified,
            };
            setMovimientos(prev => [movimientoIngreso, ...prev]);

            const nuevoSaldo = item.saldoPendiente - abono;
            const nuevoEstado = nuevoSaldo === 0 ? 'Pagado' : 'Parcial';
            const registroPago = { fecha: fechaAbonoUnified, monto: abono, cuentaName: cuentaAsoc?.nombre || 'Cuenta' };

            setCuentasPorCobrar(prev => prev.map(c => c.id === item.id ? { 
              ...c, 
              saldoPendiente: nuevoSaldo, 
              estado: nuevoEstado,
              historialPagos: [...(c.historialPagos || []), registroPago]
            } : c));

            setPagoIdCxC('');
            setMontoPagoCxCDisplay('');
            notificar('¡Pago Recibido!', `Se registraron ${formatoCOP(abono)} con éxito.`);
          };

          const guardarCxP = () => {
            const num = obtenerNumeroLimpio(saldoInicialCxPDisplay);
            const conceptoFinal = usarNuevoConceptoCxP ? nuevoConceptoCxP.trim() : conceptoCxP;

            if (!terceroCxP.trim() || !conceptoFinal || isNaN(num) || num <= 0) {
              notificar('Datos incompletos', 'Ingresa el tercero, concepto y un saldo inicial válido.');
              return;
            }

            if (usarNuevoConceptoCxP && !conceptosDeuda.includes(conceptoFinal)) {
              setConceptosDeuda(prev => [...prev, conceptoFinal]);
            }

            const nuevaCxP = {
              id: Date.now(),
              tercero: terceroCxP.trim(),
              concepto: conceptoFinal,
              valorTotal: num,
              saldoPendiente: num,
              fechaInicial: fechaGeneralReg,
              vencimiento: vencimientoCxP,
              cuentaId: cuentaCxP,
              observacion: obsCxP.trim(),
              estado: 'Pendiente',
              historialPagos: []
            };
            setCuentasPorPagar(prev => [nuevaCxP, ...prev]);
            setTerceroCxP('');
            setSaldoInicialCxPDisplay('');
            setObsCxP('');
            setUsarNuevoConceptoCxP(false);
            setNuevoConceptoCxP('');
            notificar('Cuenta por Pagar', 'Tercero y plazos registrados correctamente.');
          };

          const procesarPagoUnificado = () => {
            const item = cuentasPorPagar.find(c => c.id.toString() === pagoIdCxP);
            const abono = obtenerNumeroLimpio(montoPagoCxPDisplay);

            if (!item || isNaN(abono) || abono <= 0) {
              notificar('Datos inválidos', 'Selecciona una cuenta por pagar e ingresa un monto válido.');
              return;
            }
            if (abono > item.saldoPendiente) {
              notificar('Monto excedentario', 'El pago no puede ser mayor al saldo pendiente.');
              return;
            }

            const cuentaAsoc = cuentas.find(c => c.id === cuentaPagoCxP);
            const movimientoGasto = {
              id: Date.now(),
              cuentaId: cuentaPagoCxP,
              categoria: 'Otros Gastos',
              concepto: `Abono a ${item.tercero} (${item.concepto})`,
              valor: abono,
              tipo: 'Gasto',
              fecha: fechaAbonoUnified,
            };
            setMovimientos(prev => [movimientoGasto, ...prev]);

            const nuevoSaldo = item.saldoPendiente - abono;
            const nuevoEstado = nuevoSaldo === 0 ? 'Pagado' : 'Parcial';
            const registroPago = { fecha: fechaAbonoUnified, monto: abono, cuentaName: cuentaAsoc?.nombre || 'Cuenta' };

            setCuentasPorPagar(prev => prev.map(c => c.id === item.id ? { 
              ...c, 
              saldoPendiente: nuevoSaldo, 
              estado: nuevoEstado,
              historialPagos: [...(c.historialPagos || []), registroPago]
            } : c));

            setPagoIdCxP('');
            setMontoPagoCxPDisplay('');
            notificar('¡Pago Realizado!', `Se descontaron ${formatoCOP(abono)} con éxito.`);
          };

          const exportarPDFCuenta = (cuentaObj, movimientosCuenta, saldoActualCuenta) => {
            if (!cuentaObj) return;
            const ventana = window.open('https://miahorrointeligente.vercel.app/', '_blank');
            ventana.document.write(`
              <html>
                <head>
                  <title>Reporte Cuenta - MIA</title>
                  <style>
                    body { font-family: Arial, sans-serif; padding: 20px; color: #1B4332; }
                    .ingreso { color: #2D6A4F; font-weight: bold; }
                    .gasto { color: #C94A4A; font-weight: bold; }
                  </style>
                </head>
                <body>
                  <h2>MIA - Reporte de Movimientos de Cuenta</h2>
                  <hr/>
                  <p><strong>Cuenta:</strong> ${cuentaObj.nombre} (${cuentaObj.tipo})</p>
                  <p><strong>Saldo Inicial:</strong> ${formatoCOP(cuentaObj.saldoInicial)}</p>
                  <p><strong>Saldo Actual:</strong> ${formatoCOP(saldoActualCuenta)}</p>
                  <hr/>
                  <h3>Movimientos:</h3>
                  <ul>
                    ${movimientosCuenta.map(m => {
                      const esIngreso = m.tipo === 'Ingreso';
                      const claseCSS = esIngreso ? 'ingreso' : 'gasto';
                      const signo = esIngreso ? '+' : '-';
                      return `<li>${m.fecha} - ${m.concepto} (${m.categoria}) [<span class="${claseCSS}">${m.tipo}</span>]: <span class="${claseCSS}">${signo}${formatoCOP(m.valor)}</span></li>`;
                    }).join('')}
                  </ul>
                  <br/><hr/>
                  <p style="font-size: 11px; color: #666;">Generado por MIA - Mi Inteligencia de Ahorro</p>
                </body>
              </html>
            `);
            ventana.document.close();
            ventana.print();
          };

          const exportarCSVCuenta = (cuentaObj, movimientosCuenta) => {
            if (!cuentaObj) return;
            let csvContent = "data:text/csv;charset=utf-8,Fecha,Concepto,Categoria,Tipo,Valor\n";
            movimientosCuenta.forEach(m => {
              csvContent += `${m.fecha},${m.concepto},${m.categoria},${m.tipo},${m.valor}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `reporte_cuenta_${cuentaObj.nombre}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const exportarCSV = (terceroItem) => {
            if (!terceroItem) return;
            let csvContent = "data:text/csv;charset=utf-8,Fecha,Tercero,Concepto,Valor Total,Saldo Pendiente,Estado\n";
            csvContent += `${fechaHoy()},${terceroItem.tercero},${terceroItem.concepto},${terceroItem.valorTotal},${terceroItem.saldoPendiente},${terceroItem.estado}\n`;
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `reporte_${terceroItem.tercero}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const exportarPDF = (terceroItem) => {
            if (!terceroItem) return;
            const ventana = window.open('https://miahorrointeligente.vercel.app/', '_blank');
            ventana.document.write(`
              <html>
                <head>
                  <title>Reporte Tercero - MIA</title>
                  <style>
                    body { font-family: Arial, sans-serif; padding: 20px; color: #1B4332; }
                    .ingreso { color: #2D6A4F; font-weight: bold; }
                    .gasto { color: #C94A4A; font-weight: bold; }
                  </style>
                </head>
                <body>
                  <h2>MIA - Reporte Detallado por Tercero</h2>
                  <hr/>
                  <p><strong>Tercero:</strong> ${terceroItem.tercero}</p>
                  <p><strong>Concepto:</strong> ${terceroItem.concepto}</p>
                  <p><strong>Fecha Inicial:</strong> ${terceroItem.fechaInicial || 'N/A'}</p>
                  <p><strong>Fecha Vencimiento:</strong> ${terceroItem.vencimiento}</p>
                  <p><strong>Valor Total Inicial:</strong> ${formatoCOP(terceroItem.valorTotal)}</p>
                  <p><strong>Saldo Pendiente Actual:</strong> ${formatoCOP(terceroItem.saldoPendiente)}</p>
                  <p><strong>Estado:</strong> ${terceroItem.estado}</p>
                  <p><strong>Observaciones:</strong> ${terceroItem.observacion || 'Ninguna'}</p>
                  <hr/>
                  <h3>Historial de Movimientos:</h3>
                  <ul>
                    <li class="ingreso">${terceroItem.fechaInicial || ''} - Saldo Inicial: +${formatoCOP(terceroItem.valorTotal)}</li>
                    ${(terceroItem.historialPagos || []).map(p => `<li class="gasto">${p.fecha} - Abono (${p.cuentaName}): -${formatoCOP(p.monto)}</li>`).join('')}
                  </ul>
                  <br/><hr/>
                  <p style="font-size: 11px; color: #666;">Generado por MIA - Mi Inteligencia de Ahorro</p>
                </body>
              </html>
            `);
